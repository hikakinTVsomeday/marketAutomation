<title>答弁ウォッチ</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #F5F6F4;
    --surface: #FFFFFF;
    --ink: #20242B;
    --ink-soft: #5A6270;
    --rule: #D9DDDA;
    --accent: #24518B;
    --accent-ink: #24518B;
    --accent-soft: #E5EBF3;
    --good: #2C7A4B;
    --good-soft: #E4F0E7;
    --warn: #9A6A16;
    --warn-soft: #F4EDDB;
    --bad: #B23A2A;
    --bad-soft: #F6E5E1;
    --neutral-pill: #57616E;
    --neutral-soft: #E8EAED;
    --seal: #B23A2A;
    --quote-bg: #EFF1EE;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14171C;
      --surface: #1C2129;
      --ink: #E4E6E3;
      --ink-soft: #9AA3AD;
      --rule: #313843;
      --accent: #7FA6D3;
      --accent-ink: #A7C4E4;
      --accent-soft: #223349;
      --good: #6FBE8E;
      --good-soft: #20352A;
      --warn: #D3A555;
      --warn-soft: #3A3123;
      --bad: #D97A6A;
      --bad-soft: #402724;
      --neutral-pill: #A3ACB8;
      --neutral-soft: #2A313B;
      --seal: #D97A6A;
      --quote-bg: #21262F;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14171C;
    --surface: #1C2129;
    --ink: #E4E6E3;
    --ink-soft: #9AA3AD;
    --rule: #313843;
    --accent: #7FA6D3;
    --accent-ink: #A7C4E4;
    --accent-soft: #223349;
    --good: #6FBE8E;
    --good-soft: #20352A;
    --warn: #D3A555;
    --warn-soft: #3A3123;
    --bad: #D97A6A;
    --bad-soft: #402724;
    --neutral-pill: #A3ACB8;
    --neutral-soft: #2A313B;
    --seal: #D97A6A;
    --quote-bg: #21262F;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.85;
    font-size: 15.5px;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 22px 80px; }

  a { color: var(--accent-ink); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px;
  }

  .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  /* ---- site header ---- */
  header.site {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 26px 0 14px;
    border-bottom: 3px double var(--rule);
  }
  .site-name {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 700; font-size: 1.5rem; letter-spacing: .12em; margin: 0;
  }
  .site-name a { color: inherit; text-decoration: none; }
  .site-tag { color: var(--ink-soft); font-size: .82rem; letter-spacing: .04em; }
  .proto {
    margin-left: auto; font-size: .7rem; letter-spacing: .14em;
    border: 1px solid var(--rule); color: var(--ink-soft);
    padding: 2px 10px; border-radius: 999px; white-space: nowrap;
  }
  .crumb { margin: 18px 0 0; font-size: .84rem; }

  /* ---- section label ---- */
  .sec-label {
    display: flex; align-items: center; gap: 12px;
    font-size: .8rem; letter-spacing: .22em; color: var(--ink-soft);
    margin: 0 0 16px; font-weight: 700;
  }
  .sec-label::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }

  /* ---- home ---- */
  .home-intro { margin: 34px 0 0; font-size: .97rem; max-width: 40em; }
  .stat-strip {
    margin: 30px 0 0; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
    padding: 14px 18px 12px;
  }
  .stat .k { font-size: .72rem; letter-spacing: .12em; color: var(--ink-soft); }
  .stat .v { font-size: 1.55rem; font-weight: 500; line-height: 1.3; }
  .stat .v small { font-size: .8rem; color: var(--ink-soft); font-weight: 400; }

  .case-list { margin: 40px 0 0; display: grid; gap: 16px; }
  .case-card {
    display: block; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 6px; padding: 18px 22px; color: inherit; text-decoration: none;
  }
  .case-card:hover { border-color: var(--accent); }
  .cc-top { display: flex; gap: 12px; align-items: flex-start; }
  .cc-eyebrow { font-size: .72rem; letter-spacing: .1em; color: var(--ink-soft); margin: 0 0 4px; }
  .cc-title {
    font-family: "Shippori Mincho", serif; font-weight: 600; font-size: 1.06rem;
    line-height: 1.6; margin: 0; text-wrap: balance;
  }
  .cc-grade {
    margin-left: auto; flex: 0 0 auto;
    width: 46px; height: 46px; border: 2px solid var(--seal); border-radius: 6px;
    display: grid; place-items: center; color: var(--seal);
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 1.5rem;
    rotate: -2deg;
  }
  .cc-head { font-size: .87rem; color: var(--ink-soft); margin: 8px 0 0; }
  .cc-people { font-size: .8rem; color: var(--ink-soft); margin: 10px 0 0; }
  .cc-people b { color: var(--ink); font-weight: 500; }

  /* ---- case header ---- */
  .case-head { padding: 34px 0 8px; }
  .eyebrow {
    font-size: .74rem; letter-spacing: .18em; color: var(--accent-ink);
    text-transform: uppercase; margin-bottom: 10px;
  }
  h1.case-title {
    font-family: "Shippori Mincho", serif;
    font-weight: 600; font-size: clamp(1.4rem, 3.4vw, 1.85rem);
    line-height: 1.5; margin: 0 0 22px; text-wrap: balance; letter-spacing: .02em;
  }
  .meta {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0; border-block: 1px solid var(--rule);
  }
  .meta > div { padding: 10px 14px 10px 0; }
  .meta dt { font-size: .72rem; letter-spacing: .1em; color: var(--ink-soft); margin: 0 0 1px; }
  .meta dd { margin: 0; font-size: .92rem; font-weight: 500; }
  .src-links { margin-top: 12px; font-size: .82rem; color: var(--ink-soft); }
  .src-links a { margin-right: 14px; }

  /* ---- tldr ---- */
  .tldr { margin: 40px 0 0; }
  .tldr ol { margin: 0; padding: 0; list-style: none; counter-reset: n; display: grid; gap: 10px; }
  .tldr li {
    counter-increment: n; position: relative; padding-left: 40px;
    font-size: .98rem; line-height: 1.8;
  }
  .tldr li::before {
    content: counter(n);
    position: absolute; left: 0; top: .3em;
    width: 26px; height: 26px; display: grid; place-items: center;
    font-family: "IBM Plex Mono", monospace; font-size: .8rem;
    color: var(--accent-ink); border: 1px solid var(--accent);
    border-radius: 50%;
  }

  /* ---- overall panel ---- */
  .overall {
    margin: 44px 0 0; background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px;
    padding: 26px 28px 22px;
  }
  .overall-top { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .seal {
    flex: 0 0 auto;
    width: 84px; height: 84px;
    border: 3px solid var(--seal); border-radius: 8px;
    display: grid; place-items: center;
    color: var(--seal);
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 2.6rem;
    position: relative; rotate: -2deg;
  }
  .seal small {
    position: absolute; bottom: 4px; left: 0; right: 0;
    font-size: .58rem; letter-spacing: .28em; font-weight: 600; text-align: center;
  }
  .overall-main { flex: 1 1 300px; }
  .headline {
    font-family: "Shippori Mincho", serif; font-weight: 600;
    font-size: 1.16rem; line-height: 1.7; margin: 0 0 6px; text-wrap: balance;
  }
  .scoreline { color: var(--ink-soft); font-size: .85rem; }
  .scoreline b { color: var(--ink); font-size: 1.05rem; }

  .axes { margin-top: 20px; display: grid; gap: 9px; }
  .axis { display: grid; grid-template-columns: 7.2em 1fr 2.6em; gap: 12px; align-items: center; }
  .axis .name { font-size: .8rem; color: var(--ink-soft); }
  .axis .bar { height: 7px; background: var(--neutral-soft); border-radius: 4px; overflow: hidden; }
  .axis .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .axis .val { font-size: .8rem; text-align: right; }

  .sw { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 22px; }
  .sw h3 { font-size: .8rem; letter-spacing: .12em; margin: 0 0 8px; }
  .sw .plus h3 { color: var(--good); }
  .sw .minus h3 { color: var(--bad); }
  .sw ul { margin: 0; padding-left: 1.2em; font-size: .88rem; color: var(--ink); display: grid; gap: 6px; }
  .sw li::marker { color: var(--ink-soft); }

  /* ---- glossary ---- */
  .glossary { margin: 44px 0 0; }
  .glossary dl { margin: 0; display: grid; gap: 14px; }
  .glossary dt { font-weight: 700; font-size: .95rem; }
  .glossary dt::before { content: "◆ "; color: var(--accent-ink); font-size: .8em; }
  .glossary dd { margin: 2px 0 0 1.35em; font-size: .9rem; color: var(--ink); line-height: 1.8; }

  /* ---- overview ---- */
  .overview { margin: 44px 0 0; display: grid; gap: 20px; }
  .overview p { margin: 0; font-size: .95rem; }
  .ov-block h3 { font-family: "Shippori Mincho", serif; font-size: 1rem; margin: 0 0 6px; }

  /* ---- items ---- */
  .items { margin: 52px 0 0; display: grid; gap: 30px; }
  .item {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 6px; overflow: hidden;
  }
  .item-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--rule);
  }
  .qnum {
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 1.05rem;
    letter-spacing: .1em;
  }
  .pill {
    font-size: .74rem; font-weight: 700; letter-spacing: .08em;
    padding: 3px 12px; border-radius: 999px; white-space: nowrap;
  }
  .pill.answered { background: var(--good-soft); color: var(--good); }
  .pill.partial { background: var(--warn-soft); color: var(--warn); }
  .pill.evaded { background: var(--bad-soft); color: var(--bad); }
  .pill.refused_with_reason { background: var(--neutral-soft); color: var(--neutral-pill); }
  .resp { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .resp .bar { width: 90px; height: 6px; background: var(--neutral-soft); border-radius: 3px; overflow: hidden; }
  .resp .bar i { display: block; height: 100%; border-radius: 3px; }
  .resp .num { font-size: .78rem; color: var(--ink-soft); }

  .item-body { padding: 20px 22px 22px; display: grid; gap: 16px; }
  .speech { display: grid; gap: 8px; }
  .speech .who {
    font-size: .72rem; letter-spacing: .16em; font-weight: 700; color: var(--ink-soft);
  }
  .speech .who.gov { color: var(--accent-ink); }
  blockquote {
    margin: 0; padding: 12px 16px;
    background: var(--quote-bg); border-left: 3px solid var(--rule);
    font-family: "Shippori Mincho", serif; font-size: .9rem; line-height: 1.9;
    color: var(--ink); border-radius: 0 4px 4px 0;
  }
  .plain { font-size: .95rem; padding-left: 16px; border-left: 3px solid var(--accent); }
  .plain b.lead { font-size: .78rem; letter-spacing: .1em; color: var(--accent-ink); display: block; }

  .chip {
    font-size: .74rem; letter-spacing: .04em;
    border: 1px solid var(--bad); color: var(--bad);
    padding: 2px 10px; border-radius: 3px;
  }
  .commentary { font-size: .92rem; color: var(--ink); }
  .commentary b.lead { font-size: .76rem; letter-spacing: .14em; color: var(--ink-soft); display: block; margin-bottom: 2px; }
  .goodpoint {
    background: var(--good-soft); border-radius: 4px; padding: 12px 16px;
    font-size: .9rem;
  }
  .goodpoint b.lead { color: var(--good); font-size: .76rem; letter-spacing: .14em; display: block; margin-bottom: 2px; }

  /* ---- person page ---- */
  .person-head { padding: 34px 0 8px; }
  h1.person-name {
    font-family: "Shippori Mincho", serif; font-weight: 600;
    font-size: clamp(1.5rem, 3.6vw, 2rem); margin: 0 0 4px; letter-spacing: .06em;
  }
  .person-sub { color: var(--ink-soft); font-size: .88rem; margin: 0; }
  .agg { margin: 34px 0 0; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 6px; padding: 24px 28px 22px; }
  .agg-note { font-size: .78rem; color: var(--ink-soft); margin: 4px 0 0; }
  .dist { margin-top: 22px; display: grid; gap: 8px; }
  .dist .row { display: grid; grid-template-columns: 11em 1fr 2.2em; gap: 12px; align-items: center; }
  .dist .bar { height: 7px; background: var(--neutral-soft); border-radius: 4px; overflow: hidden; }
  .dist .bar i { display: block; height: 100%; border-radius: 4px; }
  .dist .cnt { font-size: .8rem; text-align: right; }
  .dist .lbl { font-size: .8rem; color: var(--ink-soft); }
  .agg h3 { font-size: .78rem; letter-spacing: .16em; color: var(--ink-soft); margin: 26px 0 10px; }
  .agg h3:first-of-type { margin-top: 22px; }
  .patt-list { display: grid; gap: 6px; }
  .patt-list .row { display: flex; gap: 10px; align-items: baseline; font-size: .86rem; }
  .patt-list .n { color: var(--ink-soft); font-size: .8rem; }

  /* ---- question quality / method ---- */
  .qq, .method { margin: 44px 0 0; font-size: .92rem; }
  .qq p, .method p { margin: 0 0 10px; }
  .legend { margin: 14px 0 0; display: grid; gap: 6px; font-size: .85rem; }
  .legend .row { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; }
  .legend .code { color: var(--bad); font-weight: 700; font-size: .8rem; }

  footer.site {
    margin-top: 60px; padding-top: 18px; border-top: 3px double var(--rule);
    font-size: .8rem; color: var(--ink-soft); line-height: 1.9;
  }

  @media (prefers-reduced-motion: no-preference) {
    .axis .bar i, .resp .bar i, .dist .bar i { transition: width .6s ease; }
  }
  @media (max-width: 560px) {
    .resp { margin-left: 0; width: 100%; }
    .axis { grid-template-columns: 6em 1fr 2.4em; }
    .dist .row { grid-template-columns: 8.5em 1fr 2.2em; }
  }
</style>

難型"}], "responsiveness": 65, "commentary": "検証可能な統計を5年分開示した点は答弁書として実質的な情報提供であり評価できる（毎年35万〜49万人が予定納税の払いすぎで還付を受けている、という質問者の問題意識を裏づける数字でもある）。一方で、質問した「所得税納税者総数」は年末調整だけで納税が完結する給与所得者を含むため、断りなく「確定申告書提出者数」（約2,200万人）に差し替えたことで母数の意味が変わっている。なお「法人及び個人ごと」という質問側の要求は、予定納税が個人（所得税）のみの制度で法人には法人税の中間申告という別制度がある点で設計に難があり、政府はその旨を説明することもできたが、定型句での拒否を選んだ。", "good_point": "5年分の実数を①②③に整理して開示。答弁書で具体的な統計が示されるのは比較的誠実な対応で、第三者が検証・引用できる。"}, {"q_id": "四", "question_excerpt": "予定納税制度に対する政府の現在の評価を示されたい。", "question_plain": "この制度は今うまく機能していると評価しているのか？政府としての現在の評価を聞きたい。", "answer_section": "二、四及び六について（一括答弁）", "answer_excerpt": "政府としては、現時点においても、同制度はこのような目的に照らして意義があるものと考えており…", "answer_plain": "「今でも意義がある」という結論のみ。何を根拠にそう評価しているかの説明はない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P5", "label": "まとめ答弁型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 45, "commentary": "「評価を示せ」に対して結論（意義がある）は述べたが、評価の根拠が1947年の目的の引用のみで、自ら三で示した統計（毎年数十万人が払いすぎ→還付）との関係や、現在の徴税実務での位置づけには一切触れていない。評価と呼べる分析の実体がない。", "good_point": null}, {"q_id": "五", "question_excerpt": "予定納税制度に係る政府の事務コスト及び納税者の事務コストを実績又は推計で示されたい。", "question_plain": "この制度を回すのに行政側・納税者側でどれだけの手間・費用がかかっているのか。実績か推計で示してほしい（＝費用対効果を検証したい）。", "answer_section": "五について", "answer_excerpt": "お尋ねの「予定納税制度に係る政府の事務コスト及び納税者の事務コスト」の具体的に意味するところが明らかではなく、お尋ねについてお答えすることは困難である。", "answer_plain": "「質問の意味がよくわからないので答えられない」として、数字も推計も、把握していないという事実の説明すらしなかった。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 10, "commentary": "「行政コスト」「納税協力コスト」は税制の議論で一般的な概念であり、質問文は「実績又は推計で」と答え方の幅まで示している。趣旨が不明というより、少なくとも「制度単位のコストは把握・推計していない」と実態を答えることは可能だったはずで、6問中もっとも強い回避。廃止・見直しの是非を判断する材料（費用対効果）を求めた、質問の核心部分への不応答である点も重い。", "good_point": null}, {"q_id": "六", "question_excerpt": "手続の簡素化という目的はとうに喪失しているものと思料するが、予定納税制度を廃止又は見直す考えはあるか、政府の見解を示されたい。", "question_plain": "導入時の目的（手続の簡素化）はもう失われているのだから、廃止か見直しを検討しないのか？", "answer_section": "二、四及び六について（一括答弁）", "answer_excerpt": "…その変更等は検討していない。", "answer_plain": "「廃止も見直しも検討していない」と結論は明確に答えた。ただし「目的は喪失しているのでは」という質問者の論拠への反論・説明はない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P5", "label": "まとめ答弁型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 55, "commentary": "「検討していない」という政府の立場は明確で、この点は回答になっている。ただし、質問者が積み上げた「1954年導入の目的は手続の簡素化であり、それは既に失われた」という論証に対しては、反論も現状の正当化もなく、1947年の目的論の引用で受け流している。結論だけ明確で理由が空白、という答弁書の典型例。", "good_point": "「検討していない」と立場を曖昧にしなかった点は、後の追及の起点になる明確さがある。"}], "overall": {"score": 52, "grade": "C", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "数字は出したが、制度の存在意義は「77年前の答弁の引用」で受け流し", "axes": {"responsiveness": {"label": "回答充足度", "score": 50, "note": "6問中、正面回答1・部分回答4・実質回答なし1"}, "specificity": {"label": "具体性", "score": 55, "note": "統計は具体的、制度の意義は抽象的な引用のみ"}, "evidence": {"label": "根拠の提示", "score": 40, "note": "現在の視点からの根拠・分析がほぼない"}, "clarity": {"label": "明瞭さ", "score": 70, "note": "文章自体は読み取りやすく、立場（変更しない）は明確"}}, "strengths": ["問一に「同様の見解」と正面から答え、問六でも「変更等は検討していない」と立場を明示した", "問三で5年分の統計（申告者数・前年割れ・還付者数）を実数で開示した。これは質問者の問題意識（毎年数十万人が払いすぎ→還付）を裏づける検証可能なデータでもある"], "weaknesses": ["問五（事務コスト）を「意味するところが明らかではない」という定型句で処理し、把握状況の説明すらしなかった", "問三で母数を「納税者総数」から「確定申告書提出者数」へ断りなく差し替えた", "制度の意義の説明が1947年の大臣答弁の引用のみで、源泉徴収・e-Tax等が普及した現在も妥当とする理由を示していない（二・四・六を一括処理）"]}, "question_quality": {"score": 75, "comment": "導入経緯を帝国議会・国会の議事録という一次資料で裏づけ、統計要求も①〜③に特定できる形で設計されており、質問主意書として水準が高い。一方「法人及び個人ごと」の内訳要求は、予定納税が個人所得税のみの制度（法人は法人税の中間申告）である点で制度理解に難があり、政府に拒否の口実を与えた。"}, "analysis_note": "この解析は Claude（Anthropic）による試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党への支持・不支持を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "sangiin-217-132", "source": {"title": "自らを利する政府委員の政策提言に基づき政府が利益誘導に関与した可能性に関する質問主意書", "house_label": "参議院", "session": 217, "number": 132, "submitter": "浜田聡", "submitted_on": "令和7年5月28日", "answered_on": "令和7年6月6日", "answerer_name": "石破茂", "answerer_title": "内閣総理大臣", "urls": {"meisai": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/217/meisai/m217132.htm", "question": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/217/syuh/s217132.htm", "answer": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/217/touh/t217132.htm"}}, "topic_tags": ["行政監視", "審議会", "利益相反"], "glossary": [{"term": "子ども・子育て会議", "definition": "内閣府（当時）に置かれた、保育・子育て支援の制度や公定価格を審議する会議。保育事業者の代表や有識者が委員として参加する。"}, {"term": "公定価格", "definition": "認可保育などの事業に対して国が定める単価。事業者に支払われる公費の基準になるため、その見直しは事業者の収入に直結する。"}, {"term": "利益相反", "definition": "公的な立場での判断・提言が、その人自身の私的な利益と衝突する状態。審議会の委員が自分の事業に有利な政策を提言するようなケースが典型とされる。"}, {"term": "質問主意書", "definition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["質問者は、政府の「子ども・子育て会議」の委員が、自らの法人がほぼ独占する事業の収支資料（有効回答は自社1件のみ）を政府に提出させたうえで公費の増額を求めた、と議事録を根拠に主張し、これは利益相反ではないかと質した。", "政府は「利益相反に当たるかは個別具体の内容や事情等により判断されるべきで、一概に答えることは困難」とし、判断基準も、適用されるルールも、名指しされた事案への見解も示さなかった。", "委員の再任時のチェックについては「必要に応じて、過去の提言・活動・作成資料等の内容も確認しつつ総合的に勘案して任命している」と、確認実務の存在は認めた。"], "question_overview": "質問者は、子ども・子育て会議の委員だったNPO法人代表が、自法人がほぼ独占する障害児向け居宅訪問型保育事業について、有効回答1事業所のみの収支調査を内閣府に提出させ、後の会議では同資料を公的な配付資料であるかのように再提出して公費（公定価格）の増額を要求した、資料の会計処理にも複数の問題がある、と議事録・配付資料を根拠に主張。そのうえで、①委員が政策提言によって直接の受益事業者となることは利益相反に当たるか、②委員の再任に当たり過去の提言内容や提出資料の適切さを検証しているか、の2点を質した（事実関係の主張は質問者によるもの）。", "answer_overview": "問一は「個別具体の内容や事情等により判断されるべきものであり、一概にお答えすることは困難」の一文で処理し、利益相反の判断基準や委員に適用されるルールには触れなかった。問二は「『検証』の意味するところが必ずしも明らかではない」と前置きしつつ、「いずれにせよ」として、再任時には必要に応じて過去の提言・活動・作成資料等も確認し総合的に勘案して任命している、と確認実務の存在を答えた。質問が名指しした具体的事案には、答弁全体を通じて一切言及していない。", "items": [{"q_id": "一", "question_excerpt": "子ども・子育て会議等の政府の会議の委員に任命された者が、政府に政策提言を行うことで直接の受益事業者となることは、利益相反行為に当たるか、政府の見解を示されたい。", "question_plain": "政府会議の委員が、自分の事業が直接儲かる方向の政策提言をすることは「利益相反」に当たるのか？政府の見解を聞きたい。", "answer_section": "一について", "answer_excerpt": "お尋ねについては、個別具体の内容や事情等により判断されるべきものであり、一概にお答えすることは困難である。", "answer_plain": "「ケースバイケースなので一概には答えられない」の一文のみ。どんな基準や考慮要素で判断されるのかも示していない。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P9", "label": "一概困難型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 20, "commentary": "利益相反かどうかが事案の内容次第であること自体は不合理ではない。しかし「見解を示されたい」への応答として、判断の際に考慮される要素、審議会委員に適用されるルールや指針の有無、といった一般論すら示していないため、答弁から得られる情報がほぼゼロ。質問の前提となった具体的事案（委員自らが資料を提出させ公費増を要求したとの指摘）に対する言及や、事実関係を確認する姿勢も一切ない。", "good_point": null}, {"q_id": "二", "question_excerpt": "政府委員の再任に当たり、過去に政策提言をした際の提出資料等の内容や、有識者として適切な提言内容であったかについて検証しているか示されたい。", "question_plain": "委員を再任するとき、その人が過去に出した提言や資料が適切だったかをチェックしているのか？", "answer_section": "二について", "answer_excerpt": "御指摘の「政策提言をした際の提出資料等の内容」の「検証」の具体的に意味するところが必ずしも明らかではないが、いずれにせよ、国の審議会等（…）の委員について、お尋ねの「再任」に当たっては、必要に応じて、過去の提言、活動、作成資料等の内容も確認しつつ、知識や経験等を総合的に勘案して、任命しているところである。", "answer_plain": "「趣旨がはっきりしない」と前置きしつつも、「再任時には必要に応じて過去の提言や作成資料も確認し、総合的に判断して任命している」と、確認実務があることは答えた。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 60, "commentary": "「検証しているか」に対して「必要に応じて確認しつつ総合的に勘案」と答えており、裏を返せば体系的・義務的な検証制度はない（ケースに応じた運用である）ことが読み取れる、実質のある回答。ただし冒頭の「趣旨が明らかではない」という前置きは、直後に「いずれにせよ」と回答できていることと整合せず、定型句として付された側面が強い。また、今回名指しされた事案で実際に確認が行われたのかには触れていない。", "good_point": "「審議会等」の範囲を法令の根拠条文つきで定義したうえで、再任時の確認実務の存在を明言した。「必要に応じて」という限定から制度としての検証がないことも読み取れる、追及の足がかりになる答弁。"}], "overall": {"score": 42, "grade": "D", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "「個別判断」と一般論で、名指しされた事案には最後まで触れず", "axes": {"responsiveness": {"label": "回答充足度", "score": 40, "note": "問一は実質回答なし、問二は限定つきながら回答"}, "specificity": {"label": "具体性", "score": 35, "note": "問二の任命実務はやや具体的、問一は基準の提示ゼロ"}, "evidence": {"label": "根拠の提示", "score": 30, "note": "問二は法令引用あり。問一は根拠・考慮要素の説明なし"}, "clarity": {"label": "明瞭さ", "score": 65, "note": "文章は読み取れるが、「必要に応じて」等の限定で輪郭が曖昧"}}, "strengths": ["問二で、審議会等の法的定義を明示したうえで再任時の確認実務の存在を明言した", "質問者が答弁延期を容認していたにもかかわらず、転送から4日で答弁した"], "weaknesses": ["問一で利益相反の判断基準・考慮要素・適用ルールを一切示さず、「一概に困難」の一文で処理した", "質問の前提となった具体的事案への言及や事実確認の姿勢が、答弁全体を通じてゼロ", "「必要に応じて」「総合的に勘案」という限定つきの一般論にとどまり、今回の事案で確認が行われたかは不明のまま"]}, "question_quality": {"score": 55, "comment": "会議の議事録・配付資料という一次資料に基づく事実の指摘は詳細で具体的。一方で、特定の個人・法人に対する断定的な評価を多く含む点は質問主意書として抑制を欠く。また、肝心の設問2問がいずれも一般論の形（「〜は利益相反に当たるか」「検証しているか」）になっており、「当該事案について事実関係を調査し見解を示せ」という形の設問がないため、政府が具体的事案に一切触れずに答弁を完結できる構造を、質問自体が許してしまっている。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持を意味しません。質問文中の事実関係の主張は質問者によるものであり、当サイトが事実と認定したものではありません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "shugiin-193-105", "source": {"title": "内閣総理大臣夫人の法的地位に関する質問主意書", "house_label": "衆議院", "session": 193, "number": 105, "submitter": "逢坂誠二", "submitted_on": "平成29年3月3日", "answered_on": "平成29年3月14日", "answerer_name": "安倍晋三", "answerer_title": "内閣総理大臣", "urls": {"meisai": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/193105.htm", "question": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a193105.htm", "answer": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b193105.htm"}}, "topic_tags": ["森友問題", "総理夫人", "公人・私人"], "glossary": [{"term": "「私人」閣議決定", "definition": "この質問主意書への答弁書（2017年3月14日閣議決定）に含まれた「（内閣総理大臣夫人は）公人ではなく私人であると認識している」という一文のこと。森友学園の小学校の名誉校長を務めていた昭恵氏の立場が国会で問われるなか、「私人」を閣議決定したとして大きく報道された。"}, {"term": "総理公務補助", "definition": "この答弁書で政府が定義した言葉。総理大臣夫人が「内閣総理大臣の公務の遂行を補助すること」を指し、これを支援する職員が内閣官房に置かれている（当時、専従2名＋併任3名）。"}, {"term": "大臣規範", "definition": "「国務大臣、副大臣及び大臣政務官規範」（2001年閣議決定）。大臣等の守秘義務や行動規範を定めるが、総理夫人には適用されない。質問はこの「守秘義務の穴」を突いている。"}, {"term": "質問主意書", "definition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["森友問題で総理夫人の立場が焦点になるなか、質問者は「夫人の地位は法令上規定されているか」「公人か私人か」「付いている職員5名の法的根拠は」「守秘義務がないのに機密はどう守るのか」「制度化すべきでは」の7点を体系的に質した。", "政府は「夫人の呼称に法令上の定めはない」「公人ではなく私人であると認識」と明言し、職員についても内閣法12条2項1号を根拠に専従2名＋併任3名という構成まで開示した——答弁書としては珍しく定義・根拠・数字が揃っている。", "一方、守秘義務の穴を突いた問六だけは「仮定の質問」として回答を拒否。「私人」の結論が世論の批判を浴びたが、答弁の応答性だけを見ると平均よりかなり誠実な部類に入る、という評価と世論のねじれが興味深いケース。"], "question_overview": "「妻は総理夫人と呼ばれるが役職があるわけではない」という首相答弁を起点に、①現行法令上の地位の有無、②〜④公人か私人か・その定義、⑤夫人付き職員5名の所属と法令上の根拠、⑥守秘義務がない夫人が首脳会合等に同席した場合の機密保護の方法、⑦法的地位を付与する制度化の必要性、と論点を段階的に積み上げた設計。ファーストレディ外交の意義を認めたうえで制度の穴を問う、対決型ではなく制度論型の質問。", "answer_overview": "「内閣総理大臣夫人」は呼称であり法令上の定めはないとし（一）、「公人とは一般に公職にある人」という定義を示したうえで「公人ではなく私人であると認識している」と明言（二〜四）。夫人付き職員については内閣法第12条第2項第1号を根拠に、内閣官房の専従2名＋各省庁からの併任3名という構成を開示した（五）。他方、守秘義務の穴を問うた六は「仮定の御質問」として差し控え、「適切な情報管理を行ってきている」の一般論のみ。制度化の要否（七）は「総理公務補助は適切に行われている」として実質的に否定した。", "items": [{"q_id": "一", "question_excerpt": "現行法令上、内閣総理大臣夫人の地位は規定されているのか。見解を示されたい。", "question_plain": "「総理夫人」という立場は、法律のどこかに定められているのか？", "answer_section": "一について", "answer_excerpt": "お尋ねの「地位」の意味するところが必ずしも明らかではないが、御指摘の「内閣総理大臣夫人」とは、内閣総理大臣の配偶者を指して一般的に用いられる呼称であり、当該呼称についての法令上の定めはない。", "answer_plain": "「趣旨が明らかでない」と前置きしつつ、「法令上の定めはない」と正面から答えた。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 80, "commentary": "「法令上の定めはない」という明確な回答。冒頭の趣旨不明の前置きは、直後に問題なく答えられていることと整合せず定型句の域を出ないが、回答の実質は損なわれていない。", "good_point": "問いの核心（法的根拠の不存在）を認める回答を明文で行った。"}, {"q_id": "二〜四", "question_excerpt": "内閣総理大臣夫人は、「公人」であるのか。ないとすれば「私人」であるのか。政府の見解を示されたい。（三・四では「公人ではない」という理解の確認と、「公人」の定義を要求）", "question_plain": "総理夫人は「公人」なのか「私人」なのか。首相が言う「公人ではない」の意味と、「公人」の定義もはっきりさせてほしい。", "answer_section": "二から四までについて（一括答弁）", "answer_excerpt": "公人とは、一般に、公職にある人を意味するものと承知しており、他方、私人とは、一般に、公人の対義語として用いられるものと承知している。その意味で「内閣総理大臣夫人」は、公人ではなく私人であると認識している。", "answer_plain": "「公人＝公職にある人」という定義を示したうえで、「総理夫人は公人ではなく私人」と断言した。これが世に言う「私人」閣議決定。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 75, "commentary": "定義を示し、結論を明言しており、応答性の観点では正面回答に当たる。3問の一括処理だが、いずれの問いにも実質的に答えている。ただし「役職・辞令がないから私人」という形式論に立っており、公費で職員が付き公務を補助するという実態（問五で政府自身が認めた事実）とどう整合するのかという実質論には踏み込んでいない。その緊張関係が後の問六・七で露呈する。", "good_point": "曖昧にせず「公人ではなく私人」と断言した。この明言が公式記録として残ったため、以後の国会論戦や報道の基準点になった（結論への賛否とは別に、言質としての価値は大きい）。"}, {"q_id": "五", "question_excerpt": "安倍内閣総理大臣夫人には、「サポートする職員を全体として五名配置している」…これらの職員の現時点の所属とその職務に係る法令上の根拠はどのようなものか。見解を示されたい。", "question_plain": "夫人に付いている職員5名は、どこの所属で、何の法律に基づいて働いているのか？", "answer_section": "五について", "answer_excerpt": "内閣法（昭和二十二年法律第五号）第十二条第二項第一号に規定する内閣の庶務を担当する内閣官房の職員として、…総理公務補助…を支援する職員二名を内閣官房に置いているほか、日常的には各省庁で勤務しているが、…必要に応じ支援する職員三名を内閣官房に併任させている。", "answer_plain": "内閣法12条2項1号（内閣の庶務）を根拠に、専従2名＋各省庁からの併任3名という構成を具体的に開示した。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 85, "commentary": "条文の特定、職員の構成（専従2・併任3）、勤務実態まで示した具体性の高い回答。「総理公務補助」という概念をここで定義したことも、以後の森友国会での論戦の土台になった。冒頭の趣旨不明の前置きは例によって形式的。", "good_point": "法令上の根拠を条文番号まで特定し、職員構成の内訳を数字で開示した。答弁書として模範的な部類。"}, {"q_id": "六", "question_excerpt": "「公人ではない」内閣総理大臣夫人が…総理大臣と外国の首脳との会合等に同席しても、…「職務上知ることのできた秘密」を内閣総理大臣夫人が側聞しても、それに守秘義務は課せられないと推察する。かかる場合、政府はどのような方法により、「秘密」を保護しているのか。", "question_plain": "私人である夫人には守秘義務がない。首脳会談などに同席して機密を耳にした場合、政府はどうやって秘密を守っているのか？", "answer_section": "六について", "answer_excerpt": "お尋ねについては、仮定の御質問であることからお答えすることは差し控えたいが、政府としては、適切な情報管理を行ってきている。", "answer_plain": "「仮定の質問」として拒否し、「適切な情報管理を行っている」という中身のない一文を添えた。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P7", "label": "仮定不応答型"}, {"code": "P2", "label": "差し控え型"}], "responsiveness": 15, "commentary": "夫人が首脳外交に同行・同席してきたことは政府自身が認めている公知の事実であり、「仮定の質問」という整理には無理がある。「私人」と断言したことで生じる制度上の穴（守秘義務の不存在）を突いた、この質問主意書の最も鋭い設問が、唯一まともに答えられなかった。「適切な情報管理」の具体的方法もゼロ。二〜五の丁寧さとの落差が、答えたくない論点の所在を逆に照らしている。", "good_point": null}, {"q_id": "七", "question_excerpt": "内閣総理大臣夫人が行ういわゆるファーストレディ外交は意義あるものであり…今後、総理大臣夫人に法的地位を付与するなどの制度化が必要ではないか。政府の見解を示されたい。", "question_plain": "ファーストレディ外交を続けるなら、夫人の立場を法律で整理すべきではないか？", "answer_section": "七について", "answer_excerpt": "お尋ねの「総理大臣夫人に法的地位を付与するなどの制度化」の意味するところが必ずしも明らかではないが、現在のところ、内閣総理大臣の夫人による総理公務補助は適切に行われているものと認識している。", "answer_plain": "「今のやり方で適切にやれている」として、制度化の必要性を実質的に否定した。理由の説明はない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 40, "commentary": "「制度化は不要」という立場は読み取れるが、質問者が指摘した「法的地位が未整理ゆえの不都合」（守秘義務の穴など）への応答がなく、「適切に行われている」の根拠も示されていない。問六を拒否した直後に「適切」と総括する構成は、論証としては循環している。", "good_point": null}], "overall": {"score": 58, "grade": "C", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "「私人」の結論で炎上したが、定義と根拠は示した——穴は守秘義務の問六", "axes": {"responsiveness": {"label": "回答充足度", "score": 60, "note": "7問中、正面回答が多数。問六のみ実質ゼロ"}, "specificity": {"label": "具体性", "score": 65, "note": "条文番号・職員数まで開示。問六・七は空疎"}, "evidence": {"label": "根拠の提示", "score": 55, "note": "内閣法の根拠提示は明確。「適切」の根拠はなし"}, "clarity": {"label": "明瞭さ", "score": 70, "note": "結論は明快。趣旨不明の前置きを3回多用"}}, "strengths": ["「公人ではなく私人」「法令上の定めはない」と、曖昧にせず結論を明言した", "夫人付き職員について内閣法12条2項1号という根拠条文と、専従2名＋併任3名という構成を具体的に開示した", "「総理公務補助」という概念を定義し、以後の国会論戦の共通の土台を作った"], "weaknesses": ["守秘義務の穴を突いた問六を「仮定の質問」として拒否した（夫人の外交同行は公知の事実であり、仮定とは言い難い）", "「役職がないから私人」という形式論と、公費の職員が公務補助を支える実態との整合を説明していない", "「趣旨が明らかでない」という前置きを3つの答弁ブロックで多用した（いずれも直後に回答できている）"]}, "question_quality": {"score": 85, "comment": "首相答弁の引用を起点に、法的地位→公人性→定義→職員の根拠→守秘義務→制度化と論点を段階的に積み上げた、制度論として完成度の高い設計。ファーストレディ外交の意義を認める姿勢を示したことも、対決型でない回答を引き出しやすくした。唯一、問六を「推察する」という仮定形で書いたことが「仮定の質問」という拒否の口実を与えており、「実際に同席した会合での運用を示せ」と事実ベースで問うていればこの逃げ道は塞げた。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "shugiin-193-264", "source": {"title": "「そもそも」の意味として「基本的に」と記載している辞書に関する質問主意書", "house_label": "衆議院", "session": 193, "number": 264, "submitter": "初鹿明博", "submitted_on": "平成29年4月25日", "answered_on": "平成29年5月12日", "answerer_name": "安倍晋三", "answerer_title": "内閣総理大臣", "urls": {"meisai": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/193264.htm", "question": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a193264.htm", "answer": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b193264.htm"}}, "topic_tags": ["国会答弁", "言葉の定義", "共謀罪審議"], "glossary": [{"term": "「そもそも」答弁", "definition": "2017年1月、安倍首相が共謀罪（テロ等準備罪）審議で「そもそも罪を犯すことを目的としている集団でなければ対象にならない」と答弁。後に対象の広がりを指摘されると、4月19日の法務委員会で「『そもそも』には『基本的に』という意味もある。念のために辞書で調べた」と説明を修正し、大きな議論を呼んだ。"}, {"term": "閣議決定答弁書", "definition": "質問主意書への答弁書は閣議決定を経て出される。つまりこの「辞書」答弁は、一大臣の発言ではなく内閣全体の公式見解として決定されたもの。"}, {"term": "質問主意書", "definition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["安倍首相が国会で「『そもそも』には『基本的に』という意味もある。念のために辞書で調べた」と答弁したことを受け、質問者は「本当に調べたのか」「その記載がある辞書名・出版社・出版年を示せ」の2点を質した。", "答弁書は「大辞林（第三版）には『そもそも』について『どだい』等と記述され、この『どだい』について『基本』等と記述されている」という二段の言い換えで応じた。「基本的に」と記載した辞書は示されず、「調べたのか」にも答えなかった。", "この答弁書は閣議決定を経ており、「辞書の伝言ゲーム」として広く報道された。後の再質問への答弁書（第307号）では「お尋ねのような辞書が存在しないかについては承知していない」と、直接の記載の存在を政府自身が示せないことが確定した。"], "question_overview": "共謀罪審議での「そもそも＝基本的に」という首相の説明修正について、①複数の辞書を調べたが該当する記載はなかった、本当に調べたのか、②調べたのなら「そもそも」の意味として「基本的に」と記載している辞書の辞書名・出版社名・出版年を示せ、という事実確認2問に絞った短い質問主意書。出典の特定を求めることで、口頭のその場しのぎを検証可能にする設計になっている。", "answer_overview": "2問を「一及び二について」で一括処理。「例えば」として大辞林第三版を挙げ、「そもそも」の項に「どだい」とあり、「どだい」の項に「基本」とある、という二段構成で「基本的に」への接続を試みた。首相が実際に調べたのかには触れず、問われた「『基本的に』と記載している辞書」そのものは最後まで示されなかった。", "items": [{"q_id": "一", "question_excerpt": "現在出版されている複数の辞書を調べたが、「そもそも」の意味として「基本的に」との記載がある辞書は存在しなかったが、本当に調べたのか。", "question_plain": "首相は「念のために調べた」と国会で言ったが、本当に辞書を調べたのか？", "answer_section": "一及び二について（一括答弁）", "answer_excerpt": "例えば、平成十八年に株式会社三省堂が発行した「大辞林（第三版）」には、「そもそも」について、「（物事の）最初。起こり。どだい。」等と記述され、また、この「どだい」について、「物事の基礎。もとい。基本。」等と記述されていると承知している。", "answer_plain": "「調べたのかどうか」には一切触れず、辞書の記述の紹介に置き換えた。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P5", "label": "まとめ答弁型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 10, "commentary": "「本当に調べたのか」という事実確認への回答はゼロ。首相が国会で「念のために調べてみた」と明言した行為の有無は、答弁の信頼性そのものに関わる検証可能な事実だが、確認も否定もしないまま辞書の内容紹介にすり替えられた。", "good_point": null}, {"q_id": "二", "question_excerpt": "調べている場合、安倍総理が調べた「そもそも」の意味として「基本的に」との記載がある辞書の辞書名、出版社名及び出版年を示されたい。", "question_plain": "「そもそも＝基本的に」と書いてある辞書があるなら、書名・出版社・出版年まで具体的に示してほしい。", "answer_section": "一及び二について（一括答弁）", "answer_excerpt": "例えば、平成十八年に株式会社三省堂が発行した「大辞林（第三版）」には、「そもそも」について、「（物事の）最初。起こり。どだい。」等と記述され、また、この「どだい」について、「物事の基礎。もとい。基本。」等と記述されていると承知している。", "answer_plain": "「そもそも→どだい」「どだい→基本」という二段の言い換えで大辞林を挙げた。ただし問われた「『基本的に』と記載している辞書」ではなく、たどり着いた語も「基本」であって「基本的に」ではない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P6", "label": "指標すり替え型"}], "responsiveness": 30, "commentary": "辞書名・出版社・出版年という形式要件は満たしたが、中身がすり替わっている。問われたのは「そもそも」の項に「基本的に」と記載している辞書であり、示されたのは別の語（どだい）を経由した二段の連想で、終着点も「基本」という別の語。「例えば」という限定も、他に根拠があるかのような含みを残す修辞になっている。もっとも、出典を特定可能な形で示したため第三者の検証が可能になり、実際に再質問（第三〇七号）を招いて、答弁書「お尋ねのような辞書が存在しないかについては承知していない」——直接記載する辞書を政府が示せないこと——が公式記録として確定した。", "good_point": "出典（大辞林第三版・三省堂・平成18年）を特定可能な形で示したこと自体は検証可能性の点で評価できる。その結果、記載の不存在が再質問で明らかになった。"}], "overall": {"score": 18, "grade": "E", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "辞書の伝言ゲームで「基本」を捻出——「調べたのか」には答えず", "axes": {"responsiveness": {"label": "回答充足度", "score": 20, "note": "問一は不応答、問二は問われたものと別の説明"}, "specificity": {"label": "具体性", "score": 45, "note": "出典は書誌情報つきで具体的。ただし問いとズレている"}, "evidence": {"label": "根拠の提示", "score": 25, "note": "示された根拠は二段の言い換えで、主張を直接支えない"}, "clarity": {"label": "明瞭さ", "score": 55, "note": "文章は明瞭だが「例えば」の含みが実態を曖昧にする"}}, "strengths": ["出典を書誌情報（辞書名・出版社・出版年）つきで示したため、第三者による検証が可能だった", "提出から17日で答弁した"], "weaknesses": ["「本当に調べたのか」という事実確認に一切答えなかった", "問われた「『基本的に』と記載している辞書」ではなく、別の語を経由した二段の言い換え（そもそも→どだい→基本）に置き換えた", "この内容が閣議決定を経た内閣の公式見解として出された（再質問への答弁書で、直接記載する辞書を示せないことが確定）"]}, "question_quality": {"score": 75, "comment": "「調べたのか」という事実確認と「書名・出版社・出版年」という出典特定の2問に絞った、検証可能性の高い設計。口頭答弁のその場しのぎを文書で検証するという質問主意書の使い方の好例で、実際に再質問と合わせて「直接記載する辞書は示せない」ことを公式記録化した。問一がやや挑発的な表現である点だけが、正面回答を得にくくした可能性がある。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "shugiin-198-099", "source": {"title": "日ロ平和条約交渉と日米安保条約の関係に関する質問主意書", "house_label": "衆議院", "session": 198, "number": 99, "submitter": "初鹿明博", "submitted_on": "平成31年3月19日", "answered_on": "平成31年3月29日", "answerer_name": "安倍晋三", "answerer_title": "内閣総理大臣", "urls": {"meisai": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/198099.htm", "question": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a198099.htm", "answer": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b198099.htm"}}, "topic_tags": ["外交", "北方領土", "日米安保"], "glossary": [{"term": "日米安保条約第6条", "definition": "米軍が日本国内の「施設及び区域」を使用できると定める条文。ただし、どの施設・区域を提供するかは日米地位協定に基づく手続で決まる。"}, {"term": "日米地位協定", "definition": "在日米軍の法的地位や基地提供の手続を定める協定。施設・区域の提供は、日米合同委員会を通じた両政府の個別の取極（合意）によるとされており、日本側の合意が手続上の前提になっている（第2条）。"}, {"term": "日ソ共同宣言（1956年）", "definition": "平和条約締結後に歯舞群島・色丹島を日本へ引き渡すと定めた宣言。現在の日ロ交渉の出発点で、質問当時は安倍政権がこの宣言を基礎に交渉を加速させていた。"}, {"term": "質問主意書", "definition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["プーチン大統領が「北方領土を引き渡せば米軍基地が置かれるのでは」と懸念を示したとの報道を受け、質問者は「日本は安保条約上、米軍の基地設置を拒否できるのか」「総理が『島に基地は置かない』と伝えたという報道は事実か」など4点を質した。", "政府は4問すべてに対し、「ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい」という一文だけで回答を拒否した。", "公開されている条約の一般的な解釈（問一・四)や、米国と協議したことの「有無」（問三)まで交渉を理由に封印されており、答弁書から得られる情報は実質ゼロ。"], "question_overview": "北方領土交渉が停滞し、ロシア側が「返還後の米軍基地設置」への懸念を公言するなか、交渉の最大の争点である安保条約との関係について、①米国が基地設置を求めた場合に日本は拒めるのか（根拠条文つきで）、②安倍総理が「歯舞・色丹に基地は置かない」とロシア側に伝えたとの報道は事実か、③基地設置の可能性を米国と協議したことはあるか（有無）、④「島に基地を置かない」という取り決めは条約上可能か、の4点を質した。", "answer_overview": "答弁書の本文は一文のみ。「一から四までについて お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。」──4問を一括りにし、条約解釈の一般論も、事実の有無も、すべて「交渉への支障」を理由に回答しなかった。", "items": [{"q_id": "一", "question_excerpt": "日米安保条約に基づき、米国が基地の設置を求めて来た時、日本側の都合により設置を拒むことができるのか、関連する協定や覚書等が存在するならば、その条文を示して明らかにしてください。", "question_plain": "米国が「ここに基地を置きたい」と求めてきたとき、日本は断れるのか？根拠となる条文があるなら示してほしい。", "answer_section": "一から四までについて（一括答弁）", "answer_excerpt": "お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。", "answer_plain": "「ロシアとの交渉に差し支えるので答えない」の一文のみ。条文の提示もなし。", "verdict": "refused_with_reason", "verdict_label": "回答拒否（理由明示）", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 5, "commentary": "公開されている条約の一般的な仕組みを問う設問で、進行中の交渉の中身とは切り分けて答えられる性質のもの。日米地位協定第2条は、施設・区域の提供が日米合同委員会を通じた個別の取極（合意）で決まることを定めており、この一般的な枠組み自体は政府がこれまで国会で繰り返し説明してきた内容でもある。それすら「交渉への支障」を理由に拒む必然性は、答弁書のどこにも説明されていない。", "good_point": null}, {"q_id": "二", "question_excerpt": "安倍総理が、歯舞諸島、色丹島に米軍基地を置くことはないと伝えたと報じられている（平成三十年十一月十六日付朝日新聞朝刊等）が、それは事実か。事実だとしたら、島に米軍基地を置かないと現時点で約束出来る根拠を示してください。", "question_plain": "「総理がロシア側に『引き渡し後の島に米軍基地は置かない』と伝えた」という報道は本当か？本当なら、日本側だけでそんな約束ができる根拠は何か？", "answer_section": "一から四までについて（一括答弁）", "answer_excerpt": "お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。", "answer_plain": "報道の事実確認も、根拠の説明もなし。", "verdict": "refused_with_reason", "verdict_label": "回答拒否（理由明示）", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 8, "commentary": "首脳間交渉での発言内容の確認は外交上の機微に当たり、4問の中では拒否の理由がもっとも成立しやすい設問ではある。ただし、報道が事実であれば「米国の意向を確認しないまま対ロ約束をしたのか」という民主的統制の核心に関わる論点であり、確認も否定もしないままでは、国会が交渉方針を検証する手段が事実上なくなる。", "good_point": null}, {"q_id": "三", "question_excerpt": "北方領土の島々に米軍基地を置かないと米国から確約を得ることが、日ロ平和条約交渉を進展させる前提とならざるを得ないと考えるが、北方領土への米軍基地の設置の可能性について、米国と協議を実施したことはあるのか、事実関係の有無を示してください。", "question_plain": "「北方領土に基地を置くかどうか」を米国と協議したことはあるのか。中身ではなく、有無だけでも示してほしい。", "answer_section": "一から四までについて（一括答弁）", "answer_excerpt": "お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。", "answer_plain": "協議の「有無」すら示さなかった。", "verdict": "refused_with_reason", "verdict_label": "回答拒否（理由明示）", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 5, "commentary": "協議の中身ではなく「有無」という最小限の事実だけを問う、拒否されにくいよう意図的に絞り込まれた設問。その最小限すら開示しなかったことで、「交渉への支障」という理由がどの範囲まで及ぶのか（際限があるのか）が答弁からは判別できなくなっている。", "good_point": null}, {"q_id": "四", "question_excerpt": "北方領土の島々に米軍基地を設置しないこととする取り決めを結ぶことは、日米安保条約それに付随する様々な協定上、可能なのか、政府の見解を伺います。", "question_plain": "「この島には基地を置かない」という日米間の取り決めを結ぶことは、いまの条約の仕組み上そもそも可能なのか？", "answer_section": "一から四までについて（一括答弁）", "answer_excerpt": "お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。", "answer_plain": "条約解釈の一般論としても答えなかった。", "verdict": "refused_with_reason", "verdict_label": "回答拒否（理由明示）", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 5, "commentary": "問一と同じく、特定の交渉から切り離して答えられる条約解釈の一般論。ここまで一括して一文で処理したことで、答弁書全体の情報量がゼロになり、「答えられない範囲」の説明責任も果たされていない。", "good_point": null}], "overall": {"score": 8, "grade": "E", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "4問を一文で封印 — 条約解釈の一般論まで「交渉への支障」", "axes": {"responsiveness": {"label": "回答充足度", "score": 5, "note": "4問すべて回答拒否。実質的な情報はゼロ"}, "specificity": {"label": "具体性", "score": 5, "note": "具体的内容は一切なし"}, "evidence": {"label": "根拠の提示", "score": 10, "note": "拒否理由（交渉への支障）は示したが、設問ごとの説明はない"}, "clarity": {"label": "明瞭さ", "score": 40, "note": "一文自体は明瞭だが、どの設問にどう支障が生じるのかは読み取れない"}}, "strengths": ["「答えない」という判断とその理由（交渉への支障）自体は明示しており、無視や論点ずらしではない", "提出から10日で答弁しており、手続としては迅速"], "weaknesses": ["4問を「一から四までについて」と一括りにし、条約解釈・事実確認・協議の有無という設問の性質の違いを区別しなかった", "公開されている条約の一般的解釈（問一・四）まで「交渉への支障」の対象にした", "協議の「有無」（問三）という最小限の事実すら示さず、拒否の範囲に際限がない"]}, "question_quality": {"score": 80, "comment": "報道を日付・媒体つきで出典明示し、設問を「条文の提示」「事実確認」「有無のみ」「条約解釈」と型別に設計して、段階的に拒否しにくくする工夫がされた質問。その全てが一文で拒否されたことで、かえって答弁側の姿勢が際立つ構図になっている。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "shugiin-204-003", "source": {"title": "政権による事実と異なる答弁（いわゆる虚偽答弁）及び「答えを差し控える」・「答える立場にない」など政権による説明拒否発言が連発されていることに関する質問主意書", "house_label": "衆議院", "session": 204, "number": 3, "submitter": "中谷一馬", "submitted_on": "令和3年1月18日", "answered_on": "令和3年1月29日", "answerer_name": "菅義偉", "answerer_title": "内閣総理大臣", "urls": {"meisai": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/204003.htm", "question": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a204003.htm", "answer": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b204003.htm"}}, "topic_tags": ["説明責任", "公文書管理", "桜を見る会", "答弁拒否"], "glossary": [{"term": "説明拒否発言の急増", "definition": "立命館大学の桜井啓太准教授が国会会議録を「答えを控え」等16パターンで検索したところ、1970年の7回に対し2018年は580回と80倍以上に増加。質問者はこの調査を引用して政府を問うている。"}, {"term": "森友文書改ざん問題での139回の答弁", "definition": "森友学園への国有地売却を巡る財務省の公文書改ざん問題で、後の調査報告書と食い違う政府答弁が衆議院調査局の調査で計139回あったとされる件。"}, {"term": "「桜を見る会」前夜祭の118回の答弁", "definition": "前夜祭費用の補塡を巡り、安倍前首相が「明細書はない」「補塡の事実はない」等、後に事実と異なると判明した答弁を国会で少なくとも118回行っていたとされる件。公設第一秘書は政治資金規正法違反で略式起訴された。"}, {"term": "質問主意書", "definition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["「答弁拒否の連発」自体をテーマにしたメタ構造の質問主意書。前回の答弁書の拒否文言を一つずつ引用し、「なぜ答える立場にないのか」「なぜ仮定の質問に答えられないのか」「差し控え急増の理由を類型化して示せ」「多用を自粛すべきでは」と迫った。", "政府の回答の核心は「議院において答弁を求められた事項について、合理的な理由がある場合には、答弁を差し控える旨の答弁をすることも許容される」——説明拒否を問われて、拒否が許される場合があるという一般論で応じた。何が『合理的な理由』かは示されていない。", "12の設問の多くが「趣旨不明」の前置きと前回答弁書の参照で処理された一方、首相の国会答弁に「事実と異なるものがあった」ことへの謝罪を答弁書上でも確認しており、記録としての収穫もある。"], "question_overview": "前回国会で提出した質問主意書への答弁書（「お答えする立場にない」「仮定の質問」「一概に困難」等の拒否のオンパレード）を全文引用したうえで、その一つ一つに再質問する「追い質問」型の設計。公文書管理の制度論（保存期間・電子化）から、桜を見る会前夜祭を巡る虚偽答弁への政府の責任、「はい/いいえ」を明示した確認質問、説明拒否急増（桜井准教授の調査で1970年比80倍）の理由の類型化要求、拒否文言の自粛提案まで、計12問を積み上げた。", "answer_overview": "12問を7ブロックに再編。公文書の保存期間は現行法令の枠組み説明（一の1）、全文書の電子的永久保存には「慎重な検討が必要」（一の2）。前夜祭関連は「前首相個人の政治活動であり政府としてお答えする立場にない」を再掲し（二の1・2）、「はい/いいえ」を求めた確認質問には前回答弁書の参照のみ（三）。「責任」の解釈を問うた設問には、首相が本会議で「答弁の中に事実と異なるものがあった」と謝罪した事実に言及（四・五の2）。そして説明拒否の理由の類型化と自粛を求めた核心部分には、「合理的な理由がある場合には、答弁を差し控える旨の答弁をすることも許容される」という一般論を示した（五の1・3・4）。", "items": [{"q_id": "一の1", "question_excerpt": "保存期間をいたずらに短くして満了後直ちに廃棄するという考え方自体を改める必要があると考えるが、如何か。政府の見解を伺いたい。", "question_plain": "公文書改ざん問題を踏まえ、「保存期間を短くしてすぐ廃棄する」という運用の考え方自体を改めるべきではないか？", "answer_section": "一の１について", "answer_excerpt": "お尋ねの「保存期間をいたずらに短くして満了後直ちに廃棄するという考え方」の意味するところが必ずしも明らかではないが、…各行政機関において当該定めに従って適切に行政文書の管理を行っているところである。", "answer_plain": "現行の法令・ガイドラインの枠組みを説明し、「適切に管理している」と回答。「考え方を改めるべきか」という問いには答えていない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 35, "commentary": "現行制度の説明としては一定の情報があるが、改ざん問題を踏まえて「運用の考え方を見直すか」という規範的な問いには触れず、「適切に行っている」という現状肯定で締めている。問いの前提（問題が起きた）と回答（適切である）の間の緊張が説明されていない。", "good_point": null}, {"q_id":   const CASES = JSON.parse(document.getElementById("data").textContent);
  const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const VERDICTS = [
    ["answered", "回答", "var(--good)"],
    ["partial", "部分回答", "var(--warn)"],
    ["evaded", "実質回答なし", "var(--bad)"],
    ["refused_with_reason", "回答拒否（理由明示）", "var(--neutral-pill)"],
  ];
  const VERDICT_COLOR = Object.fromEntries(VERDICTS.map(([k, , c]) => [k, c]));

  const AXES = [
    ["responsiveness", "回答充足度"],
    ["specificity", "具体性"],
    ["evidence", "根拠の提示"],
    ["clarity", "明瞭さ"],
  ];

  const PATTERN_LEGEND = [
    ["P1 趣旨不明型", "「お尋ねの趣旨が明らかではない」として答えない"],
    ["P2 差し控え型", "「お答えを差し控えたい」として答えない"],
    ["P3 作業困難型", "「膨大な作業を要する」等を理由に資料・数値を示さない"],
    ["P4 過去答弁引用型", "過去の答弁の引用のみで、現在の説明・根拠を示さない"],
    ["P5 まとめ答弁型", "複数の設問を一括りにして個別の論点への回答を薄める"],
    ["P6 指標すり替え型", "問われた数値・定義と異なるものに断りなく置き換えて答える"],
    ["P7 仮定不応答型", "「仮定の質問にはお答えできない」として答えない"],
    ["P8 論点スルー型", "質問者の論拠・前提に反論も説明もせず結論だけ述べる"],
    ["P9 一概困難型", "「個別具体の事情により一概にお答えすることは困難」として基準を示さない"],
  ];

  const gradeOf = s => s >= 85 ? "A" : s >= 70 ? "B" : s >= 50 ? "C" : s >= 30 ? "D" : "E";
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  const r1 = x => Math.round(x * 10) / 10;

  const personHref = (role, name) => `#/person/${role}/${encodeURIComponent(name)}`;
  const bySubmitter = name => CASES.filter(c => c.source.submitter === name);
  const byAnswerer = name => CASES.filter(c => c.source.answerer_name === name);

  /* ---------- shared fragments ---------- */

  function axisRow(label, score) {
    return `<div class="axis">
      <span class="name">${esc(label)}</span>
      <span class="bar"><i style="width:${score}%"></i></span>
      <span class="val mono">${r1(score)}</span>
    </div>`;
  }

  function caseCard(c) {
    const s = c.source, o = c.overall;
    return `<a class="case-card" href="#/case/${esc(c.id)}">
      <div class="cc-top">
        <div>
          <p class="cc-eyebrow">${esc(s.house_label)} 第${s.session}回国会 質問第${s.number}号 ・ ${esc(s.answered_on)}答弁</p>
          <p class="cc-title">${esc(s.title)}</p>
        </div>
        <span class="cc-grade" aria-label="総合評価 ${esc(o.grade)}">${esc(o.grade)}</span>
      </div>
      <p class="cc-head">${esc(o.headline)}　<span class="mono">${o.score}/100</span></p>
      <p class="cc-people">提出 <b>${esc(s.submitter)}</b>　／　答弁 <b>${esc(s.answerer_title)} ${esc(s.answerer_name)}</b></p>
    </a>`;
  }

  function distRows(entries, total) {
    return entries.map(([label, count, color]) => `<div class="row">
      <span class="lbl">${esc(label)}</span>
      <span class="bar"><i style="width:${total ? count / total * 100 : 0}%;background:${color}"></i></span>
      <span class="cnt mono">${count}</span>
    </div>`).join("");
  }

  function itemCard(it) {
    const col = VERDICT_COLOR[it.verdict] || "var(--neutral-pill)";
    return `<article class="item">
      <div class="item-head">
        <span class="qnum">問${esc(it.q_id)}</span>
        <span class="pill ${esc(it.verdict)}">${esc(it.verdict_label)}</span>
        ${it.patterns.map(p => `<span class="chip">${esc(p.label)}</span>`).join("")}
        <span class="resp"><span class="bar"><i style="width:${it.responsiveness}%;background:${col}"></i></span>
          <span class="num mono">${it.responsiveness}/100</span></span>
      </div>
      <div class="item-body">
        <div class="speech">
          <span class="who">質問（${esc(it.q_id)}）</span>
          <blockquote>${esc(it.question_excerpt)}</blockquote>
          <p class="plain"><b class="lead">なにを聞いている？</b>${esc(it.question_plain)}</p>
        </div>
        <div class="speech">
          <span class="who gov">政府答弁（${esc(it.answer_section)}）</span>
          <blockquote>${esc(it.answer_excerpt)}</blockquote>
          <p class="plain"><b class="lead">どう答えた？</b>${esc(it.answer_plain)}</p>
        </div>
        <p class="commentary"><b class="lead">評価</b>${esc(it.commentary)}</p>
        ${it.good_point ? `<p class="goodpoint"><b class="lead">誠実ハイライト</b>${esc(it.good_point)}</p>` : ""}
      </div>
    </article>`;
  }

  function siteFooter(extra) {
    return `${extra ? esc(extra) + "<br>" : ""}
      本サイトの評価はAIによる試作です。公開された質問・答弁の全文のみに基づき、
      特定の政党・議員・政府への支持・不支持を意味しません。
      出典: 参議院・衆議院「質問主意書・答弁書」`;
  }

  /* ---------- views ---------- */

  function renderHome() {
    const scores = CASES.map(c => c.overall.score);
    const nItems = CASES.reduce((n, c) => n + c.items.length, 0);
    document.getElementById("app").innerHTML = `
      <p class="home-intro">国会の質問主意書と政府答弁書をAIが読み、
      「何を聞いたのか」「どう答えたのか」を平易な日本語に翻訳したうえで、
      答弁が質問に実質的に答えているか（誠実度）を設問ごとに評価します。
      誠実な回答も、回避もそのまま記録します。</p>
      <div class="stat-strip">
        <div class="stat"><span class="k">収録した答弁書</span><br><span class="v mono">${CASES.length}<small> 件</small></span></div>
        <div class="stat"><span class="k">逐条評価した設問</span><br><span class="v mono">${nItems}<small> 問</small></span></div>
        <div class="stat"><span class="k">平均誠実度スコア</span><br><span class="v mono">${r1(avg(scores))}<small> /100</small></span></div>
      </div>
      <div class="case-list">
        <h2 class="sec-label" style="margin:24px 0 0">収録答弁</h2>
        ${CASES.map(caseCard).join("")}
      </div>
      <section class="method">
        <h2 class="sec-label" style="margin-top:44px">評価の方法</h2>
        <p>評価対象は「答弁が質問に実質的に答えているか」のみで、政策の当否や政治的立場は評価しません。
        設問ごとに 回答／部分回答／実質回答なし／回答拒否（理由明示）を判定し、
        回避の手法を次の分類でタグ付けします。質問側の質も同じ基準で評価します。</p>
        <div class="legend">
          ${PATTERN_LEGEND.map(([code, txt]) =>
            `<div class="row"><span class="code">${esc(code)}</span><span>${esc(txt)}</span></div>`).join("")}
        </div>
      </section>`;
    document.getElementById("foot").innerHTML = siteFooter("");
  }

  function renderCase(c) {
    const s = c.source, o = c.overall;
    document.getElementById("app").innerHTML = `
      <p class="crumb"><a href="#/">← 一覧へ</a></p>
      <section class="case-head">
        <p class="eyebrow">${esc(s.house_label)} 第${s.session}回国会 質問第${s.number}号</p>
        <h1 class="case-title">${esc(s.title)}</h1>
        <dl class="meta">
          <div><dt>提出者</dt><dd><a href="${personHref("submitter", s.submitter)}">${esc(s.submitter)}</a></dd></div>
          <div><dt>答弁者</dt><dd><a href="${personHref("answerer", s.answerer_name)}">${esc(s.answerer_title)} ${esc(s.answerer_name)}</a></dd></div>
          <div><dt>提出日</dt><dd>${esc(s.submitted_on)}</dd></div>
          <div><dt>答弁書受領日</dt><dd>${esc(s.answered_on)}</dd></div>
          <div><dt>分野</dt><dd>${(c.topic_tags || []).map(esc).join("・")}</dd></div>
        </dl>
        <p class="src-links">原文（${esc(s.house_label)}サイト）:
          <a href="${esc(s.urls.question)}" target="_blank" rel="noopener">質問本文</a>
          <a href="${esc(s.urls.answer)}" target="_blank" rel="noopener">答弁本文</a>
          <a href="${esc(s.urls.meisai)}" target="_blank" rel="noopener">経過情報</a>
        </p>
      </section>

      <section class="tldr">
        <h2 class="sec-label">３行でわかる</h2>
        <ol>${c.tldr.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
      </section>

      <section class="overall">
        <div class="overall-top">
          <div class="seal" role="img" aria-label="総合評価 ${esc(o.grade)}">${esc(o.grade)}<small>総合評価</small></div>
          <div class="overall-main">
            <p class="headline">${esc(o.headline)}</p>
            <p class="scoreline">誠実度スコア <b class="mono">${o.score}</b> / 100　（${esc(o.grade_scale)}）</p>
          </div>
        </div>
        <div class="axes">
          ${AXES.map(([k]) => axisRow(o.axes[k].label, o.axes[k].score)).join("")}
        </div>
        <div class="sw">
          <div class="plus"><h3>誠実だった点</h3><ul>${o.strengths.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
          <div class="minus"><h3>問題のある点</h3><ul>${o.weaknesses.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
        </div>
      </section>

      <section class="glossary">
        <h2 class="sec-label">まず用語から</h2>
        <dl>${c.glossary.map(g => `<div><dt>${esc(g.term)}</dt><dd>${esc(g.definition)}</dd></div>`).join("")}</dl>
      </section>

      <section class="overview">
        <h2 class="sec-label">今回のやりとり</h2>
        <div class="ov-block"><h3>質問者は何を問うたか</h3><p>${esc(c.question_overview)}</p></div>
        <div class="ov-block"><h3>政府はどう答えたか</h3><p>${esc(c.answer_overview)}</p></div>
      </section>

      <section>
        <div class="items">
          <h2 class="sec-label" style="margin:0">逐条評価 — ${c.items.length}つの設問と答弁</h2>
          ${c.items.map(itemCard).join("")}
        </div>
      </section>

      <section class="qq">
        <h2 class="sec-label">質問の質について</h2>
        <p>${esc(c.question_quality.comment)}（設計評価: <span class="mono">${c.question_quality.score}</span>/100）</p>
      </section>`;

    document.getElementById("foot").innerHTML =
      `${esc(c.analysis_note)}<br>
       出典: ${esc(s.house_label)}「質問主意書」（<a href="${esc(s.urls.meisai)}" target="_blank" rel="noopener">第${s.session}回国会 質問第${s.number}号</a>）／解析日: ${esc(c.analyzed_at)}`;
  }

  function renderPerson(role, name) {
    const isSub = role === "submitter";
    const cs = isSub ? bySubmitter(name) : byAnswerer(name);
    if (!cs.length) { renderNotFound(); return; }

    const items = cs.flatMap(c => c.items);
    const meanScore = avg(cs.map(c => c.overall.score));
    const meanQQ = avg(cs.map(c => c.question_quality.score));
    const verdictCounts = VERDICTS.map(([k, label, color]) =>
      [label, items.filter(it => it.verdict === k).length, color]);
    const pattCounts = {};
    for (const it of items) for (const p of it.patterns)
      pattCounts[p.label] = (pattCounts[p.label] || 0) + 1;
    const patts = Object.entries(pattCounts).sort((a, b) => b[1] - a[1]);
    const titles = isSub ? [] : [...new Set(cs.map(c => c.source.answerer_title))];

    const scopeNote = isSub
      ? "スコア・判定・パターンは、この議員が提出した質問主意書に対する政府答弁の集計です。"
      : "スコア・判定・パターンは、この答弁者名で受領した答弁書の集計です（答弁書は内閣として閣議決定されたもの）。";

    document.getElementById("app").innerHTML = `
      <p class="crumb"><a href="#/">← 一覧へ</a></p>
      <section class="person-head">
        <p class="eyebrow">${isSub ? "質問提出者" : "答弁者"}${titles.length ? "　" + esc(titles.join("・")) : ""}</p>
        <h1 class="person-name">${esc(name)}</h1>
        <p class="person-sub">収録 ${cs.length}件 ・ 逐条評価 ${items.length}問</p>
      </section>

      <section class="agg">
        <div class="overall-top">
          <div class="seal" role="img" aria-label="平均評価 ${gradeOf(meanScore)}">${gradeOf(meanScore)}<small>平均評価</small></div>
          <div class="overall-main">
            <p class="headline">${isSub ? "この議員の質問への答弁は" : "この答弁者の答弁は"}、平均 <span class="mono">${r1(meanScore)}</span>/100</p>
            <p class="agg-note">${esc(scopeNote)}</p>
          </div>
        </div>
        <h3>評価軸の平均</h3>
        <div class="axes">
          ${AXES.map(([k, label]) => axisRow(label, avg(cs.map(c => c.overall.axes[k].score)))).join("")}
        </div>
        <h3>設問ごとの判定の内訳（${items.length}問）</h3>
        <div class="dist">${distRows(verdictCounts, items.length)}</div>
        ${patts.length ? `<h3>使われた回避パターン</h3>
        <div class="patt-list">
          ${patts.map(([label, n]) => `<div class="row"><span class="chip">${esc(label)}</span><span class="n mono">×${n}</span></div>`).join("")}
        </div>` : ""}
        ${isSub ? `<h3>質問の質（設計評価）の平均</h3>
        <div class="axes">${axisRow("質問の質", meanQQ)}</div>` : ""}
      </section>

      <div class="case-list">
        <h2 class="sec-label" style="margin:40px 0 0">${isSub ? "提出した質問主意書" : "答弁した質問主意書"}</h2>
        ${cs.map(caseCard).join("")}
      </div>`;
    document.getElementById("foot").innerHTML = siteFooter("");
  }

  function renderNotFound() {
    document.getElementById("app").innerHTML =
      `<p class="crumb"><a href="#/">← 一覧へ</a></p><p style="margin-top:30px">ページが見つかりませんでした。</p>`;
    document.getElementById("foot").innerHTML = siteFooter("");
  }

  /* ---------- router ---------- */

  function route() {
    const h = location.hash || "#/";
    const parts = h.replace(/^#\//, "").split("/").filter(Boolean);
    if (parts.length === 0) renderHome();
    else if (parts[0] === "case" && parts[1]) {
      const c = CASES.find(x => x.id === decodeURIComponent(parts[1]));
      c ? renderCase(c) : renderNotFound();
    } else if (parts[0] === "person" && parts[1] && parts[2]) {
      renderPerson(parts[1], decodeURIComponent(parts[2]));
    } else renderNotFound();
    window.scrollTo(0, 0);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
