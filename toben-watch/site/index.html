<title>答弁ウォッチ</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --paper: #F5F6F4;
    --surface: #FFFFFF;
    --ink: #20242B;
    --ink-soft: #5A6270;
    --rule: #D9DDDA;
    --accent: #24518B;
    --accent-ink: #24518B;
    --accent-soft: #E5EBF3;
    --good: #2C7A4B;
    --good-soft: #E4F0E7;
    --warn: #9A6A16;
    --warn-soft: #F4EDDB;
    --bad: #B23A2A;
    --bad-soft: #F6E5E1;
    --neutral-pill: #57616E;
    --neutral-soft: #E8EAED;
    --seal: #B23A2A;
    --quote-bg: #EFF1EE;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14171C;
      --surface: #1C2129;
      --ink: #E4E6E3;
      --ink-soft: #9AA3AD;
      --rule: #313843;
      --accent: #7FA6D3;
      --accent-ink: #A7C4E4;
      --accent-soft: #223349;
      --good: #6FBE8E;
      --good-soft: #20352A;
      --warn: #D3A555;
      --warn-soft: #3A3123;
      --bad: #D97A6A;
      --bad-soft: #402724;
      --neutral-pill: #A3ACB8;
      --neutral-soft: #2A313B;
      --seal: #D97A6A;
      --quote-bg: #21262F;
    }
  }
  :root[data-theme="dark"] {
    --paper: #14171C;
    --surface: #1C2129;
    --ink: #E4E6E3;
    --ink-soft: #9AA3AD;
    --rule: #313843;
    --accent: #7FA6D3;
    --accent-ink: #A7C4E4;
    --accent-soft: #223349;
    --good: #6FBE8E;
    --good-soft: #20352A;
    --warn: #D3A555;
    --warn-soft: #3A3123;
    --bad: #D97A6A;
    --bad-soft: #402724;
    --neutral-pill: #A3ACB8;
    --neutral-soft: #2A313B;
    --seal: #D97A6A;
    --quote-bg: #21262F;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    line-height: 1.85;
    font-size: 15.5px;
  }
  .wrap { max-width: 800px; margin: 0 auto; padding: 0 22px 80px; }

  a { color: var(--accent-ink); text-underline-offset: 3px; }
  a:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px;
  }

  .mono { font-family: "IBM Plex Mono", monospace; font-variant-numeric: tabular-nums; }

  /* ---- site header ---- */
  header.site {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 26px 0 14px;
    border-bottom: 3px double var(--rule);
  }
  .site-name {
    font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
    font-weight: 700; font-size: 1.5rem; letter-spacing: .12em; margin: 0;
  }
  .site-name a { color: inherit; text-decoration: none; }
  .site-tag { color: var(--ink-soft); font-size: .82rem; letter-spacing: .04em; }
  .proto {
    margin-left: auto; font-size: .7rem; letter-spacing: .14em;
    border: 1px solid var(--rule); color: var(--ink-soft);
    padding: 2px 10px; border-radius: 999px; white-space: nowrap;
  }
  .crumb { margin: 18px 0 0; font-size: .84rem; }

  /* ---- section label ---- */
  .sec-label {
    display: flex; align-items: center; gap: 12px;
    font-size: .8rem; letter-spacing: .22em; color: var(--ink-soft);
    margin: 0 0 16px; font-weight: 700;
  }
  .sec-label::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }

  /* ---- home ---- */
  .home-intro { margin: 34px 0 0; font-size: .97rem; max-width: 40em; }
  .stat-strip {
    margin: 30px 0 0; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
    padding: 14px 18px 12px;
  }
  .stat .k { font-size: .72rem; letter-spacing: .12em; color: var(--ink-soft); }
  .stat .v { font-size: 1.55rem; font-weight: 500; line-height: 1.3; }
  .stat .v small { font-size: .8rem; color: var(--ink-soft); font-weight: 400; }

  .case-list { margin: 40px 0 0; display: grid; gap: 16px; }
  .case-card {
    display: block; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 6px; padding: 18px 22px; color: inherit; text-decoration: none;
  }
  .case-card:hover { border-color: var(--accent); }
  .cc-top { display: flex; gap: 12px; align-items: flex-start; }
  .cc-eyebrow { font-size: .72rem; letter-spacing: .1em; color: var(--ink-soft); margin: 0 0 4px; }
  .cc-title {
    font-family: "Shippori Mincho", serif; font-weight: 600; font-size: 1.06rem;
    line-height: 1.6; margin: 0; text-wrap: balance;
  }
  .cc-grade {
    margin-left: auto; flex: 0 0 auto;
    width: 46px; height: 46px; border: 2px solid var(--seal); border-radius: 6px;
    display: grid; place-items: center; color: var(--seal);
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 1.5rem;
    rotate: -2deg;
  }
  .cc-head { font-size: .87rem; color: var(--ink-soft); margin: 8px 0 0; }
  .cc-people { font-size: .8rem; color: var(--ink-soft); margin: 10px 0 0; }
  .cc-people b { color: var(--ink); font-weight: 500; }

  /* ---- case header ---- */
  .case-head { padding: 34px 0 8px; }
  .eyebrow {
    font-size: .74rem; letter-spacing: .18em; color: var(--accent-ink);
    text-transform: uppercase; margin-bottom: 10px;
  }
  h1.case-title {
    font-family: "Shippori Mincho", serif;
    font-weight: 600; font-size: clamp(1.4rem, 3.4vw, 1.85rem);
    line-height: 1.5; margin: 0 0 22px; text-wrap: balance; letter-spacing: .02em;
  }
  .meta {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0; border-block: 1px solid var(--rule);
  }
  .meta > div { padding: 10px 14px 10px 0; }
  .meta dt { font-size: .72rem; letter-spacing: .1em; color: var(--ink-soft); margin: 0 0 1px; }
  .meta dd { margin: 0; font-size: .92rem; font-weight: 500; }
  .src-links { margin-top: 12px; font-size: .82rem; color: var(--ink-soft); }
  .src-links a { margin-right: 14px; }

  /* ---- tldr ---- */
  .tldr { margin: 40px 0 0; }
  .tldr ol { margin: 0; padding: 0; list-style: none; counter-reset: n; display: grid; gap: 10px; }
  .tldr li {
    counter-increment: n; position: relative; padding-left: 40px;
    font-size: .98rem; line-height: 1.8;
  }
  .tldr li::before {
    content: counter(n);
    position: absolute; left: 0; top: .3em;
    width: 26px; height: 26px; display: grid; place-items: center;
    font-family: "IBM Plex Mono", monospace; font-size: .8rem;
    color: var(--accent-ink); border: 1px solid var(--accent);
    border-radius: 50%;
  }

  /* ---- overall panel ---- */
  .overall {
    margin: 44px 0 0; background: var(--surface);
    border: 1px solid var(--rule); border-radius: 6px;
    padding: 26px 28px 22px;
  }
  .overall-top { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .seal {
    flex: 0 0 auto;
    width: 84px; height: 84px;
    border: 3px solid var(--seal); border-radius: 8px;
    display: grid; place-items: center;
    color: var(--seal);
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 2.6rem;
    position: relative; rotate: -2deg;
  }
  .seal small {
    position: absolute; bottom: 4px; left: 0; right: 0;
    font-size: .58rem; letter-spacing: .28em; font-weight: 600; text-align: center;
  }
  .overall-main { flex: 1 1 300px; }
  .headline {
    font-family: "Shippori Mincho", serif; font-weight: 600;
    font-size: 1.16rem; line-height: 1.7; margin: 0 0 6px; text-wrap: balance;
  }
  .scoreline { color: var(--ink-soft); font-size: .85rem; }
  .scoreline b { color: var(--ink); font-size: 1.05rem; }

  .axes { margin-top: 20px; display: grid; gap: 9px; }
  .axis { display: grid; grid-template-columns: 7.2em 1fr 2.6em; gap: 12px; align-items: center; }
  .axis .name { font-size: .8rem; color: var(--ink-soft); }
  .axis .bar { height: 7px; background: var(--neutral-soft); border-radius: 4px; overflow: hidden; }
  .axis .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .axis .val { font-size: .8rem; text-align: right; }

  .sw { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; margin-top: 22px; }
  .sw h3 { font-size: .8rem; letter-spacing: .12em; margin: 0 0 8px; }
  .sw .plus h3 { color: var(--good); }
  .sw .minus h3 { color: var(--bad); }
  .sw ul { margin: 0; padding-left: 1.2em; font-size: .88rem; color: var(--ink); display: grid; gap: 6px; }
  .sw li::marker { color: var(--ink-soft); }

  /* ---- glossary ---- */
  .glossary { margin: 44px 0 0; }
  .glossary dl { margin: 0; display: grid; gap: 14px; }
  .glossary dt { font-weight: 700; font-size: .95rem; }
  .glossary dt::before { content: "◆ "; color: var(--accent-ink); font-size: .8em; }
  .glossary dd { margin: 2px 0 0 1.35em; font-size: .9rem; color: var(--ink); line-height: 1.8; }

  /* ---- overview ---- */
  .overview { margin: 44px 0 0; display: grid; gap: 20px; }
  .overview p { margin: 0; font-size: .95rem; }
  .ov-block h3 { font-family: "Shippori Mincho", serif; font-size: 1rem; margin: 0 0 6px; }

  /* ---- items ---- */
  .items { margin: 52px 0 0; display: grid; gap: 30px; }
  .item {
    background: var(--surface); border: 1px solid var(--rule);
    border-radius: 6px; overflow: hidden;
  }
  .item-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--rule);
  }
  .qnum {
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 1.05rem;
    letter-spacing: .1em;
  }
  .pill {
    font-size: .74rem; font-weight: 700; letter-spacing: .08em;
    padding: 3px 12px; border-radius: 999px; white-space: nowrap;
  }
  .pill.answered { background: var(--good-soft); color: var(--good); }
  .pill.partial { background: var(--warn-soft); color: var(--warn); }
  .pill.evaded { background: var(--bad-soft); color: var(--bad); }
  .pill.refused_with_reason { background: var(--neutral-soft); color: var(--neutral-pill); }
  .resp { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .resp .bar { width: 90px; height: 6px; background: var(--neutral-soft); border-radius: 3px; overflow: hidden; }
  .resp .bar i { display: block; height: 100%; border-radius: 3px; }
  .resp .num { font-size: .78rem; color: var(--ink-soft); }

  .item-body { padding: 20px 22px 22px; display: grid; gap: 16px; }
  .speech { display: grid; gap: 8px; }
  .speech .who {
    font-size: .72rem; letter-spacing: .16em; font-weight: 700; color: var(--ink-soft);
  }
  .speech .who.gov { color: var(--accent-ink); }
  blockquote {
    margin: 0; padding: 12px 16px;
    background: var(--quote-bg); border-left: 3px solid var(--rule);
    font-family: "Shippori Mincho", serif; font-size: .9rem; line-height: 1.9;
    color: var(--ink); border-radius: 0 4px 4px 0;
  }
  .plain { font-size: .95rem; padding-left: 16px; border-left: 3px solid var(--accent); }
  .plain b.lead { font-size: .78rem; letter-spacing: .1em; color: var(--accent-ink); display: block; }

  .chip {
    font-size: .74rem; letter-spacing: .04em;
    border: 1px solid var(--bad); color: var(--bad);
    padding: 2px 10px; border-radius: 3px;
  }
  .commentary { font-size: .92rem; color: var(--ink); }
  .commentary b.lead { font-size: .76rem; letter-spacing: .14em; color: var(--ink-soft); display: block; margin-bottom: 2px; }
  .goodpoint {
    background: var(--good-soft); border-radius: 4px; padding: 12px 16px;
    font-size: .9rem;
  }
  .goodpoint b.lead { color: var(--good); font-size: .76rem; letter-spacing: .14em; display: block; margin-bottom: 2px; }

  /* ---- person page ---- */
  .person-head { padding: 34px 0 8px; }
  h1.person-name {
    font-family: "Shippori Mincho", serif; font-weight: 600;
    font-size: clamp(1.5rem, 3.6vw, 2rem); margin: 0 0 4px; letter-spacing: .06em;
  }
  .person-sub { color: var(--ink-soft); font-size: .88rem; margin: 0; }
  .agg { margin: 34px 0 0; background: var(--surface); border: 1px solid var(--rule);
    border-radius: 6px; padding: 24px 28px 22px; }
  .agg-note { font-size: .78rem; color: var(--ink-soft); margin: 4px 0 0; }
  .dist { margin-top: 22px; display: grid; gap: 8px; }
  .dist .row { display: grid; grid-template-columns: 11em 1fr 2.2em; gap: 12px; align-items: center; }
  .dist .bar { height: 7px; background: var(--neutral-soft); border-radius: 4px; overflow: hidden; }
  .dist .bar i { display: block; height: 100%; border-radius: 4px; }
  .dist .cnt { font-size: .8rem; text-align: right; }
  .dist .lbl { font-size: .8rem; color: var(--ink-soft); }
  .agg h3 { font-size: .78rem; letter-spacing: .16em; color: var(--ink-soft); margin: 26px 0 10px; }
  .agg h3:first-of-type { margin-top: 22px; }
  .patt-list { display: grid; gap: 6px; }
  .patt-list .row { display: flex; gap: 10px; align-items: baseline; font-size: .86rem; }
  .patt-list .n { color: var(--ink-soft); font-size: .8rem; }

  /* ---- question quality / method ---- */
  .qq, .method { margin: 44px 0 0; font-size: .92rem; }
  .qq p, .method p { margin: 0 0 10px; }
  .legend { margin: 14px 0 0; display: grid; gap: 6px; font-size: .85rem; }
  .legend .row { display: grid; grid-template-columns: 9.5em 1fr; gap: 10px; }
  .legend .code { color: var(--bad); font-weight: 700; font-size: .8rem; }

  footer.site {
    margin-top: 60px; padding-top: 18px; border-top: 3px double var(--rule);
    font-size: .8rem; color: var(--ink-soft); line-height: 1.9;
  }

  @media (prefers-reduced-motion: no-preference) {
    .axis .bar i, .resp .bar i, .dist .bar i { transition: width .6s ease; }
  }
  @media (max-width: 560px) {
    .resp { margin-left: 0; width: 100%; }
    .axis { grid-template-columns: 6em 1fr 2.4em; }
    .dist .row { grid-template-columns: 8.5em 1fr 2.2em; }
  }
</style>

難型"}], "responsiveness": 65, "commentary": "検証可能な統計を5年分開示した点は答弁書として実質的な情報提供であり評価できる（毎年35万〜49万人が予定納税の払いすぎで還付を受けている、という質問者の問題意識を裏づける数字でもある）。一方で、質問した「所得税納税者総数」は年末調整だけで納税が完結する給与所得者を含むため、断りなく「確定申告書提出者数」（約2,200万人）に差し替えたことで母数の意味が変わっている。なお「法人及び個人ごと」という質問側の要求は、予定納税が個人（所得税）のみの制度で法人には法人税の中間申告という別制度がある点で設計に難があり、政府はその旨を説明することもできたが、定型句での拒否を選んだ。", "good_point": "5年分の実数を①②③に整理して開示。答弁書で具体的な統計が示されるのは比較的誠実な対応で、第三者が検証・引用できる。"}, {"q_id": "四", "question_excerpt": "予定納税制度に対する政府の現在の評価を示されたい。", "question_plain": "この制度は今うまく機能していると評価しているのか？政府としての現在の評価を聞きたい。", "answer_section": "二、四及び六について（一括答弁）", "answer_excerpt": "政府としては、現時点においても、同制度はこのような目的に照らして意義があるものと考えており…", "answer_plain": "「今でも意義がある」という結論のみ。何を根拠にそう評価しているかの説明はない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P5", "label": "まとめ答弁型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 45, "commentary": "「評価を示せ」に対して結論（意義がある）は述べたが、評価の根拠が1947年の目的の引用のみで、自ら三で示した統計（毎年数十万人が払いすぎ→還付）との関係や、現在の徴税実務での位置づけには一切触れていない。評価と呼べる分析の実体がない。", "good_point": null}, {"q_id": "五", "question_excerpt": "予定納税制度に係る政府の事務コスト及び納税者の事務コストを実績又は推計で示されたい。", "question_plain": "この制度を回すのに行政側・納税者側でどれだけの手間・費用がかかっているのか。実績か推計で示してほしい（＝費用対効果を検証したい）。", "answer_section": "五について", "answer_excerpt": "お尋ねの「予定納税制度に係る政府の事務コスト及び納税者の事務コスト」の具体的に意味するところが明らかではなく、お尋ねについてお答えすることは困難である。", "answer_plain": "「質問の意味がよくわからないので答えられない」として、数字も推計も、把握していないという事実の説明すらしなかった。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 10, "commentary": "「行政コスト」「納税協力コスト」は税制の議論で一般的な概念であり、質問文は「実績又は推計で」と答え方の幅まで示している。趣旨が不明というより、少なくとも「制度単位のコストは把握・推計していない」と実態を答えることは可能だったはずで、6問中もっとも強い回避。廃止・見直しの是非を判断する材料（費用対効果）を求めた、質問の核心部分への不応答である点も重い。", "good_point": null}, {"q_id": "六", "question_excerpt": "手続の簡素化という目的はとうに喪失しているものと思料するが、予定納税制度を廃止又は見直す考えはあるか、政府の見解を示されたい。", "question_plain": "導入時の目的（手続の簡素化）はもう失われているのだから、廃止か見直しを検討しないのか？", "answer_section": "二、四及び六について（一括答弁）", "answer_excerpt": "…その変更等は検討していない。", "answer_plain": "「廃止も見直しも検討していない」と結論は明確に答えた。ただし「目的は喪失しているのでは」という質問者の論拠への反論・説明はない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P5", "label": "まとめ答弁型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 55, "commentary": "「検討していない」という政府の立場は明確で、この点は回答になっている。ただし、質問者が積み上げた「1954年導入の目的は手続の簡素化であり、それは既に失われた」という論証に対しては、反論も現状の正当化もなく、1947年の目的論の引用で受け流している。結論だけ明確で理由が空白、という答弁書の典型例。", "good_point": "「検討していない」と立場を曖昧にしなかった点は、後の追及の起点になる明確さがある。"}], "overall": {"score": 52, "grade": "C", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "数字は出したが、制度の存在意義は「77年前の答弁の引用」で受け流し", "axes": {"responsiveness": {"label": "回答充足度", "score": 50, "note": "6問中、正面回答1・部分回答4・実質回答なし1"}, "specificity": {"label": "具体性", "score": 55, "note": "統計は具体的、制度の意義は抽象的な引用のみ"}, "evidence": {"label": "根拠の提示", "score": 40, "note": "現在の視点からの根拠・分析がほぼない"}, "clarity": {"label": "明瞭さ", "score": 70, "note": "文章自体は読み取りやすく、立場（変更しない）は明確"}}, "strengths": ["問一に「同様の見解」と正面から答え、問六でも「変更等は検討していない」と立場を明示した", "問三で5年分の統計（申告者数・前年割れ・還付者数）を実数で開示した。これは質問者の問題意識（毎年数十万人が払いすぎ→還付）を裏づける検証可能なデータでもある"], "weaknesses": ["問五（事務コスト）を「意味するところが明らかではない」という定型句で処理し、把握状況の説明すらしなかった", "問三で母数を「納税者総数」から「確定申告書提出者数」へ断りなく差し替えた", "制度の意義の説明が1947年の大臣答弁の引用のみで、源泉徴収・e-Tax等が普及した現在も妥当とする理由を示していない（二・四・六を一括処理）"]}, "question_quality": {"score": 75, "comment": "導入経緯を帝国議会・国会の議事録という一次資料で裏づけ、統計要求も①〜③に特定できる形で設計されており、質問主意書として水準が高い。一方「法人及び個人ごと」の内訳要求は、予定納税が個人所得税のみの制度（法人は法人税の中間申告）である点で制度理解に難があり、政府に拒否の口実を与えた。"}, "analysis_note": "この解析は Claude（Anthropic）による試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党への支持・不支持を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "sangiin-217-132", "source": {"title": "自らを利する政府委員の政策提言に基づき政府が利益誘導に関与した可能性に関する質問主意書", "house_label": "参議院", "session": 217, "number": 132, "submitter": "浜田聡", "submitted_on": "令和7年5月28日", "answered_on": "令和7年6月6日", "answerer_name": "石破茂", "answerer_title": "内閣総理大臣", "urls": {"meisai": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/217/meisai/m217132.htm", "question": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/217/syuh/s217132.htm", "answer": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/217/touh/t217132.htm"}}, "topic_tags": ["行政監視", "審議会", "利益相反"], "glossary": [{"term": "子ども・子育て会議", "definition": "内閣府（当時）に置かれた、保育・子育て支援の制度や公定価格を審議する会議。保育事業者の代表や有識者が委員として参加する。"}, {"term": "公定価格", "definition": "認可保育などの事業に対して国が定める単価。事業者に支払われる公費の基準になるため、その見直しは事業者の収入に直結する。"}, {"term": "利益相反", "definition": "公的な立場での判断・提言が、その人自身の私的な利益と衝突する状態。審議会の委員が自分の事業に有利な政策を提言するようなケースが典型とされる。"}, {"term": "質問主意書", "definition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["質問者は、政府の「子ども・子育て会議」の委員が、自らの法人がほぼ独占する事業の収支資料（有効回答は自社1件のみ）を政府に提出させたうえで公費の増額を求めた、と議事録を根拠に主張し、これは利益相反ではないかと質した。", "政府は「利益相反に当たるかは個別具体の内容や事情等により判断されるべきで、一概に答えることは困難」とし、判断基準も、適用されるルールも、名指しされた事案への見解も示さなかった。", "委員の再任時のチェックについては「必要に応じて、過去の提言・活動・作成資料等の内容も確認しつつ総合的に勘案して任命している」と、確認実務の存在は認めた。"], "question_overview": "質問者は、子ども・子育て会議の委員だったNPO法人代表が、自法人がほぼ独占する障害児向け居宅訪問型保育事業について、有効回答1事業所のみの収支調査を内閣府に提出させ、後の会議では同資料を公的な配付資料であるかのように再提出して公費（公定価格）の増額を要求した、資料の会計処理にも複数の問題がある、と議事録・配付資料を根拠に主張。そのうえで、①委員が政策提言によって直接の受益事業者となることは利益相反に当たるか、②委員の再任に当たり過去の提言内容や提出資料の適切さを検証しているか、の2点を質した（事実関係の主張は質問者によるもの）。", "answer_overview": "問一は「個別具体の内容や事情等により判断されるべきものであり、一概にお答えすることは困難」の一文で処理し、利益相反の判断基準や委員に適用されるルールには触れなかった。問二は「『検証』の意味するところが必ずしも明らかではない」と前置きしつつ、「いずれにせよ」として、再任時には必要に応じて過去の提言・活動・作成資料等も確認し総合的に勘案して任命している、と確認実務の存在を答えた。質問が名指しした具体的事案には、答弁全体を通じて一切言及していない。", "items": [{"q_id": "一", "question_excerpt": "子ども・子育て会議等の政府の会議の委員に任命された者が、政府に政策提言を行うことで直接の受益事業者となることは、利益相反行為に当たるか、政府の見解を示されたい。", "question_plain": "政府会議の委員が、自分の事業が直接儲かる方向の政策提言をすることは「利益相反」に当たるのか？政府の見解を聞きたい。", "answer_section": "一について", "answer_excerpt": "お尋ねについては、個別具体の内容や事情等により判断されるべきものであり、一概にお答えすることは困難である。", "answer_plain": "「ケースバイケースなので一概には答えられない」の一文のみ。どんな基準や考慮要素で判断されるのかも示していない。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P9", "label": "一概困難型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 20, "commentary": "利益相反かどうかが事案の内容次第であること自体は不合理ではない。しかし「見解を示されたい」への応答として、判断の際に考慮される要素、審議会委員に適用されるルールや指針の有無、といった一般論すら示していないため、答弁から得られる情報がほぼゼロ。質問の前提となった具体的事案（委員自らが資料を提出させ公費増を要求したとの指摘）に対する言及や、事実関係を確認する姿勢も一切ない。", "good_point": null}, {"q_id": "二", "question_excerpt": "政府委員の再任に当たり、過去に政策提言をした際の提出資料等の内容や、有識者として適切な提言内容であったかについて検証しているか示されたい。", "question_plain": "委員を再任するとき、その人が過去に出した提言や資料が適切だったかをチェックしているのか？", "answer_section": "二について", "answer_excerpt": "御指摘の「政策提言をした際の提出資料等の内容」の「検証」の具体的に意味するところが必ずしも明らかではないが、いずれにせよ、国の審議会等（…）の委員について、お尋ねの「再任」に当たっては、必要に応じて、過去の提言、活動、作成資料等の内容も確認しつつ、知識や経験等を総合的に勘案して、任命しているところである。", "answer_plain": "「趣旨がはっきりしない」と前置きしつつも、「再任時には必要に応じて過去の提言や作成資料も確認し、総合的に判断して任命している」と、確認実務があることは答えた。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 60, "commentary": "「検証しているか」に対して「必要に応じて確認しつつ総合的に勘案」と答えており、裏を返せば体系的・義務的な検証制度はない（ケースに応じた運用である）ことが読み取れる、実質のある回答。ただし冒頭の「趣旨が明らかではない」という前置きは、直後に「いずれにせよ」と回答できていることと整合せず、定型句として付された側面が強い。また、今回名指しされた事案で実際に確認が行われたのかには触れていない。", "good_point": "「審議会等」の範囲を法令の根拠条文つきで定義したうえで、再任時の確認実務の存在を明言した。「必要に応じて」という限定から制度としての検証がないことも読み取れる、追及の足がかりになる答弁。"}], "overall": {"score": 42, "grade": "D", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "「個別判断」と一般論で、名指しされた事案には最後まで触れず", "axes": {"responsiveness": {"label": "回答充足度", "score": 40, "note": "問一は実質回答なし、問二は限定つきながら回答"}, "specificity": {"label": "具体性", "score": 35, "note": "問二の任命実務はやや具体的、問一は基準の提示ゼロ"}, "evidence": {"label": "根拠の提示", "score": 30, "note": "問二は法令引用あり。問一は根拠・考慮要素の説明なし"}, "clarity": {"label": "明瞭さ", "score": 65, "note": "文章は読み取れるが、「必要に応じて」等の限定で輪郭が曖昧"}}, "strengths": ["問二で、審議会等の法的定義を明示したうえで再任時の確認実務の存在を明言した", "質問者が答弁延期を容認していたにもかかわらず、転送から4日で答弁した"], "weaknesses": ["問一で利益相反の判断基準・考慮要素・適用ルールを一切示さず、「一概に困難」の一文で処理した", "質問の前提となった具体的事案への言及や事実確認の姿勢が、答弁全体を通じてゼロ", "「必要に応じて」「総合的に勘案」という限定つきの一般論にとどまり、今回の事案で確認が行われたかは不明のまま"]}, "question_quality": {"score": 55, "comment": "会議の議事録・配付資料という一次資料に基づく事実の指摘は詳細で具体的。一方で、特定の個人・法人に対する断定的な評価を多く含む点は質問主意書として抑制を欠く。また、肝心の設問2問がいずれも一般論の形（「〜は利益相反に当たるか」「検証しているか」）になっており、「当該事案について事実関係を調査し見解を示せ」という形の設問がないため、政府が具体的事案に一切触れずに答弁を完結できる構造を、質問自体が許してしまっている。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持を意味しません。質問文中の事実関係の主張は質問者によるものであり、当サイトが事実と認定したものではありません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "sangiin-221-110", "source": {"title": "国旗の損壊等の処罰に関する法律に関する質問主意書", "house_label": "参議院", "session": 221, "number": 110, "submitter": "小西洋之", "submitted_on": "令和8年7月24日", "answered_on": "令和8年8月4日", "answerer_name": "高市早苗", "answerer_title": "内閣総理大臣", "note": "国会法第75条第2項により答弁延期（8月4日まで）", "urls": {"meisai": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/221/meisai/m221110.htm", "question": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/221/syuh/s221110.htm", "answer": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/221/touh/t221110.htm"}}, "topic_tags": ["国旗損壊罪", "表現の自由", "刑事法", "議員立法"], "glossary": [{"term": "国旗損壊罪（国旗の損壊等の処罰に関する法律）", "definition": "2026年（令和8年）に議員立法で成立した新しい法律（令和8年法律第69号）。「人に著しく不快又は嫌悪の情を催させるような方法」で公然と国旗を損壊・除去・汚損する行為を処罰する。表現の自由との関係が国会審議の最大の争点だった。"}, {"term": "議員立法", "definition": "政府（内閣）ではなく国会議員が提出した法律案。政府は「提出者ではない」ため、法案の趣旨の説明責任は提出議員が負うが、成立後にこの法律を執行（運用）するのは政府・警察である。この答弁書の攻防はまさにこの点を巡っている。"}, {"term": "衆理事懇資料", "definition": "法案提出者が衆議院内閣委員会理事懇談会に提出した、構成要件該当性の判断例集。「悪天候の日に公道に国旗を置き泥で汚す→該当」「国旗を靴で踏むが汚れない→非該当」等の具体例を列挙する。法律の実際の運用範囲を知る手がかりとして質問者が照準した。"}, {"term": "違法性阻却事由（刑法35条）", "definition": "形式上は犯罪の構成要件に当たっても、「正当な行為」であれば処罰しないという刑法の一般原則。政治デモや芸術表現での国旗損壊がこれで救済されるのかが争点。"}], "tldr": ["2026年に議員立法で成立したばかりの国旗損壊罪について、質問者は「これから運用するのは政府だ」として、合憲性・処罰範囲・警察運用など20問を突きつけた。冒頭で「議員立法だからと答弁を留保するな」と釘まで刺した。", "政府はまさにその「議員立法であり政府としてお答えする立場にない」を8回近く繰り返し、合憲性（思想良心・表現の自由・罪刑法定主義）への政府自身の見解は最後まで示さず、法案提出者の国会答弁の長文引用で埋めた。", "一方で、警察庁が全国警察に発出した2本の通達（発番号・日付つき）と、処罰範囲の判断例集「衆理事懇資料」が通達で全国の警察に示された事実を開示するなど、運用の実務情報では具体的な回答もあった。"], "question_overview": "成立直後の国旗損壊罪について、①「将来の抑止」という予防的な立法事実の妥当性、②〜⑥憲法19条・21条との適合性と「表現内容規制ではないか」という理論的疑義、⑦〜⑩処罰範囲の判断例集（衆理事懇資料）を政府・警察が運用基準とするのか、⑪〜⑬警察庁の通達の内容、⑭〜⑱政治的・芸術的表現への適用と萎縮効果・罪刑法定主義、⑲違法運用時の国家賠償、⑳愛国心醸成を目的とした運用の否定、まで計20問。冒頭に「運用する立場となる政府は答弁を留保するな」という予防線を張った、執行責任を正面から問う設計。", "answer_overview": "「本法は衆議院議員により発議され…政府としてはお答えする立場にない」という定型を合憲性・評価に関わる設問のほぼ全てで使い、そのつど法案提出者の委員会答弁を長文で引用して代替した。政府自身の見解として答えたのは、予防的立法の実例（クローン技術規制法等）、「その他の客観的な事情」の意味、国家賠償の一般論、警察庁の2本の通達の存在と内容など。特に、処罰範囲の判断例集である衆理事懇資料が警察庁課長通達で全国警察に示された事実の開示は、運用実務を検証可能にする実質的な情報だった。愛国心目的の運用を否定するかという問いには、否定の言質を与えず「趣旨及び内容を周知徹底」とだけ答えた。", "items": [{"q_id": "一", "question_excerpt": "法益の侵害の発生を将来に向かって抑止するという立法事実について、政府の見解を示されたい。また、政府は…「予防的立法事実」に基づいて国会に法律案を提出したことはあるのか。", "question_plain": "「まだほとんど起きていない行為を将来の抑止のために罰する」という立法の正当化について政府はどう考えるか。政府自身がそういう法案を出した前例はあるか。", "answer_section": "一について", "answer_excerpt": "政府としては、お答えする立場にないが、…法案提出者が…答弁したものと承知している。…将来発生する事案を予防する必要性を踏まえた上で立法されたものとしては、例えば、ヒトに関するクローン技術等の規制に関する法律…やヒトゲノム編集胚等の取扱いの規制に関する法律…があるものと承知している。", "answer_plain": "前段（見解）は「立場にない」として提出者答弁の引用で代替。後段（前例）にはクローン規制法など2つの実例を挙げて答えた。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 55, "commentary": "後段は具体的な法律名2件を挙げた実質のある回答。前段の「立場にない」は、議員立法の立法事実の説明責任が提出者にあるという整理としては形式的に成り立つが、質問者が冒頭で釘を刺した「運用する政府」としての見解は示されないまま。", "good_point": "予防目的の立法の実例として、クローン技術規制法・ヒトゲノム編集胚規制法という具体的な法律名を示した。"}, {"q_id": "二", "question_excerpt": "本法の立法事実の一つとされる国旗を損壊等する事案の発生を将来に向かって抑止する必要性について政府はどのように評価するか。", "question_plain": "「国旗損壊を将来にわたって抑止する必要性」を、政府自身はどう評価しているのか。", "answer_section": "二について", "answer_excerpt": "議員立法に対するお尋ねの「評価」については、政府としてお答えする立場にない。", "answer_plain": "一文で「立場にない」。", "verdict": "refused_with_reason", "verdict_label": "回答拒否（理由明示）", "patterns": [{"code": "P2", "label": "差し控え型"}], "responsiveness": 15, "commentary": "法案への賛否ではなく「抑止の必要性の評価」は、執行機関として運用方針に直結する事項であり、「議員立法だから」という理由では本来切り分けられないはずの問い。それでも一文で処理した。", "good_point": null}, {"q_id": "三〜五", "question_excerpt": "日本国憲法第十九条の「思想及び良心の自由」の観点から、本法は合憲であると考えるか、政府の見解を示されたい。（四で21条、五で処罰範囲の過度な拡大の懸念を同様に質問）", "question_plain": "この法律は思想良心の自由・表現の自由に照らして合憲だと、政府自身は考えているのか。内心を考慮しない建て付けはむしろ処罰範囲を広げないか。", "answer_section": "三から五までについて（一括答弁）", "answer_excerpt": "本法を誠実に執行するのが政府に課せられた責務であることから、政府としては、お答えする立場にないが、…法案提出者が「…思想及び良心の自由や表現の自由といった憲法上の権利を不当に制約するものではなく、これらによる萎縮効果も生まないものと考えております。」と答弁したものと承知している。", "answer_plain": "「執行するのが責務だから見解を言う立場にない」という珍しい理屈で、政府自身の合憲性判断を示さず、提出者答弁の引用のみ。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P4", "label": "過去答弁引用型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 30, "commentary": "「誠実に執行する責務があるから合憲性を答えない」は論理としては逆で、執行する以上は合憲であるという判断を政府自身が引き受けているはずであり、政府は他の法律については合憲性の見解を国会で答弁してきた。引用された提出者答弁で解釈の枠組み自体は読み取れるが、罰則を実際に適用する側の憲法判断が示されないのは、この答弁書全体の最大の空白。", "good_point": null}, {"q_id": "六", "question_excerpt": "国旗損壊行為はいわゆる象徴的表現行為であり…象徴的表現行為を罰することは…表現内容規制となり得ると考えるが、政府の見解を示されたい。", "question_plain": "国旗を壊すこと自体が「表現」なのだから、それを罰するのは表現の中身への規制になるのでは。", "answer_section": "六について", "answer_excerpt": "政府としては、お答えする立場にないが、…法案提出者が「…本法案が内容規制につながる、あるいは内容規制そのものであるという御指摘は当たらないものと考えております。」と答弁したものと承知している。", "answer_plain": "これも「立場にない」＋提出者答弁（公然わいせつ罪や礼拝所不敬罪の類比を含む長文）の引用のみ。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 25, "commentary": "表現内容規制か否かは、まさに警察・検察が適用の場面で判断を迫られる論点であり、執行政府の見解が最も必要とされる設問。引用で枠組みを示したこと以上の実質はない。", "good_point": null}, {"q_id": "七", "question_excerpt": "政府は衆理事懇資料の内容を把握しているのか。", "question_plain": "処罰範囲の判断例集（衆理事懇資料）を政府は把握しているか。", "answer_section": "七について", "answer_excerpt": "お尋ねの「衆理事懇資料の内容」は承知している。", "answer_plain": "「承知している」と即答。", "verdict": "answered", "verdict_label": "回答", "patterns": [], "responsiveness": 95, "commentary": "一文だが問いに過不足なく答えている。後続の設問（八〜十、十二）への布石となる事実確認が成立した。", "good_point": "簡潔な事実確認に正面から答え、以降の運用論の前提を固定した。"}, {"q_id": "八〜十", "question_excerpt": "衆理事懇資料では…「「日本がんばれ」あるいは「国旗損壊罪反対」という文言によって、構成要件該当性の判断が左右されることはない」とされている…政府は同様の認識をもって本法を運用するのか。（九・十で該当例・非該当例、違法性阻却の考え方も同様に確認）", "question_plain": "判断例集に書かれた「該当する例・しない例」「違法性が阻却される例」の通りに、政府・警察は運用するのか。", "answer_section": "八から十までについて（一括答弁）", "answer_excerpt": "犯罪の成否は、捜査機関により収集された証拠に基づき個々に判断されるべき事柄であるため、一概にお答えすることは困難であるが、捜査機関においては、御指摘の「衆理事懇資料」の内容を含む国会における審議の内容等も踏まえ、個別具体的な事案に応じて、法と証拠に基づき適切に対処していくものと考えている。", "answer_plain": "「個別判断なので一概には言えない」としつつ、「捜査機関は衆理事懇資料の内容を含む国会審議を踏まえて対処する」とは述べた。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P9", "label": "一概困難型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 50, "commentary": "「同様の認識で運用するか」への直接の諾否は避けたが、「資料の内容を含む国会審議を踏まえる」という表現で、資料が運用上の参照基準に入ることは実質的に認めた。個別判断論と両立し得るぎりぎりの線の回答で、完全な回避ではない。", "good_point": "衆理事懇資料が捜査運用の考慮対象になることを答弁書上で確認した。"}, {"q_id": "十一", "question_excerpt": "本法第二条第二項の「その他の客観的な事情」とは、具体的にどのようなことを指すと政府は認識しているのか。", "question_plain": "条文にある「その他の客観的な事情」とは具体的に何を指すのか。", "answer_section": "十一について", "answer_excerpt": "…お尋ねについては、本法第二条第二項の規定により、「行為の外形」、「周囲の状況」を含む「客観的な事情」を指すものと認識している。", "answer_plain": "提出者答弁を引用したうえで、政府自身の「認識」として条文の意味を答えた。", "verdict": "answered", "verdict_label": "回答", "patterns": [], "responsiveness": 70, "commentary": "この答弁書の中で数少ない、「政府の認識」を主語にした解釈の提示。内容は条文の同義反復に近く新規性は薄いが、他の設問との落差が「答えようと思えば答えられる」ことを示している。", "good_point": "「立場にない」を使わず、政府自身の認識として条文解釈を示した。"}, {"q_id": "十二・十三", "question_excerpt": "警察庁が第一線の警察官等への周知のために作成する通達等は、衆理事懇資料の内容を踏まえるという理解でよいか。（十三では運用解釈を網羅的に示すよう要求）", "question_plain": "現場の警察官向けの通達は、判断例集を踏まえた内容になるのか。運用解釈を整理して全部示してほしい。", "answer_section": "十二及び十三について（一括答弁）", "answer_excerpt": "警察庁においては、都道府県警察に対し、「国旗の損壊等の処罰に関する法律の公布について（通達）」（令和八年七月二十四日付け警察庁丙捜一発第七号…）において、本法の趣旨、要点等を示すとともに、…（令和八年七月二十四日付け警察庁丁捜一発第百三十三号等…）において、お尋ねの「衆理事懇資料」を示した上で、「法の運用上の留意事項等」として、「組織的かつ緻密な擬律判断の徹底」、「逮捕に関する適正な判断の確保」及び「通報への適切な対応等」について指示している。", "answer_plain": "警察庁が既に2本の通達（発番号・日付つき）を出しており、課長通達では衆理事懇資料そのものを全国警察に示した、と具体的に開示した。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 65, "commentary": "この答弁書で最も実質のある開示。判断例集が全国の警察に正式に示されたという事実は、恣意的運用への重要な歯止めであり、第三者が通達を開示請求で検証する道も開いた。十三の「網羅的に示せ」には通達の存在の提示にとどまり応じていないため満点ではない。", "good_point": "通達の発番号・日付・指示内容（擬律判断の徹底、逮捕の適正判断、通報対応）まで特定して開示し、衆理事懇資料が全国警察に示された事実を公式に確認した。"}, {"q_id": "十四", "question_excerpt": "政治的表現や芸術表現における国旗損壊行為については、本法の構成要件に該当し得るのか、政府の見解を示されたい。", "question_plain": "政治的・芸術的な表現としての国旗損壊も、処罰の対象になり得るのか。", "answer_section": "十四について", "answer_excerpt": "御指摘の…態様については様々なものが想定されるため、一概にお答えすることは困難であるが、…法案提出者が「…芸術表現であれ、ほかの何らかの活動であれ、あくまでもその行為自体が人に著しく不快又は嫌悪の情を催させる方法によって公然と行われたのであれば構成要件該当性を満たす可能性がございます。」…と答弁したものと承知している。", "answer_plain": "「一概に困難」としつつ、提出者答弁の引用で「該当し得る（そのうえで違法性阻却があり得る）」という枠組みを示した。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P9", "label": "一概困難型"}, {"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 40, "commentary": "引用を通じて「政治的・芸術的表現でも構成要件に該当し得る」という運用上の重要情報は伝わる。ただし政府自身の見解としては語られておらず、責任の所在は提出者答弁に預けられたまま。", "good_point": null}, {"q_id": "十五", "question_excerpt": "附帯決議…の内容を踏まえると、…国会答弁は矛盾していると考えるが、政府の見解を示されたい。また、政府は同項を踏まえて、本法をどのように運用していくのか。", "question_plain": "「正当な表現は処罰対象にしない」という附帯決議と、「目的は考慮しない」という提出者答弁は矛盾していないか。政府は附帯決議をどう運用に反映するのか。", "answer_section": "十五について", "answer_excerpt": "前段のお尋ねについては、…政府としてお答えする立場にない。後段のお尋ねについては、犯罪の成否は…一概にお答えすることは困難であるが、捜査機関においては、国会における審議の内容等も踏まえ…適切に対処していくものと考えている。", "answer_plain": "矛盾の有無は「立場にない」、運用への反映は「審議の内容等も踏まえ適切に」の一般論。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P9", "label": "一概困難型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 20, "commentary": "附帯決議は両院の委員会が政府に向けて発したものであり、その遵守方法は紛れもなく政府の所管事項。「附帯決議をどう運用に反映するか」まで「一概に困難」で流したのは、この答弁書の中でも回避の度合いが強い。", "good_point": null}, {"q_id": "十六", "question_excerpt": "一般論として、「正当行為」とは具体的にどのようなものを指すのか、また、政治的意見の表明が「正当行為」に当たるのはどのような場合か…加えて、国旗損壊罪の適用除外の根拠が刑法第三十五条の正当行為であるとすることが法的な正当性を有するものであるか。", "question_plain": "「正当行為なら処罰されない」と言うが、正当行為とは何か。政治的意見の表明はいつ正当行為になるのか。そもそも表現の自由の保障を刑法35条頼みにするのは適切か。", "answer_section": "十六について", "answer_excerpt": "刑法…第三十五条の正当行為とは、一般に、社会生活上正当なものとして許容される行為をいうとされており、どのような行為が正当行為に該当するかについては、…一概にお答えすることは困難である。…一般論として申し上げれば、本法第二条第一項の罰則についても刑法第三十五条が適用され得るものと承知している。", "answer_plain": "正当行為の一般的定義と「本法にも35条は適用され得る」ことは答えたが、政治的表現がいつ救済されるかの基準は示さなかった。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P9", "label": "一概困難型"}, {"code": "P1", "label": "趣旨不明型"}], "responsiveness": 45, "commentary": "定義と適用可能性という外枠は示した。ただし質問の核心である「政治的意見の表明が正当行為に当たる場合の基準」——萎縮効果を防ぐために最も必要な情報——は個別判断論で示されなかった。", "good_point": null}, {"q_id": "十七・十八", "question_excerpt": "社会通念上相当かどうかを基準とするならば、本法第二条第一項の罰則が適用されるかどうかは不明確となり、政治的表現を行おうとする者に不当な萎縮効果を及ぼすのではないか。（十八では罪刑法定主義違反の疑いを質問）", "question_plain": "「社会通念で判断」では何が処罰されるか予測できず、表現が萎縮する。構成要件が曖昧で罪刑法定主義に反しないか。", "answer_section": "十七について／十八について", "answer_excerpt": "お尋ねについては、一についてで述べたとおり、…政府としては、お答えする立場にないが、…法案提出者が「…刑罰法規として十分な明確性を備えており、憲法三十一条にも違反するものではないというふうに考えております。」と答弁したものと承知している。", "answer_plain": "萎縮効果も罪刑法定主義も「立場にない」＋提出者答弁の引用で処理。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 25, "commentary": "罪刑法定主義（憲法31条）適合性は、起訴・公判を担う政府側の解釈が実務を決める論点であり、三〜五と同じく「執行責務があるから答えない」という転倒した理屈が繰り返されている。", "good_point": null}, {"q_id": "十九", "question_excerpt": "公務員が、国旗の損壊等の処罰に関する法律の運用において、故意又は過失によって違法に他人に損害を加えたときには、国家賠償法の規定により…賠償する責任があり…その理解でよいか。", "question_plain": "警察官などが本法を違法に運用して損害を与えたら、国家賠償の対象になる。この理解で合っているか。", "answer_section": "十九について", "answer_excerpt": "…一般論として申し上げれば、国又は公共団体の公権力の行使に当たる公務員が、その職務を行うについて、故意又は過失によって違法に他人に損害を加えたときは、国又は公共団体は、同条第一項に規定する賠償責任を負い、…求償権を有することとなる。", "answer_plain": "前置きはあるが、国家賠償法の適用関係を条文に即して確認した。実質的に「その理解でよい」という回答。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 75, "commentary": "一般論の形ではあるが、本法の違法運用が国家賠償の対象になり得ることを答弁書上で確認した。運用する側への牽制として機能する言質であり、質問の狙いは達成されている。", "good_point": "違法な運用が国家賠償責任と公務員個人への求償につながることを、条文に即して明文で確認した。"}, {"q_id": "二十", "question_excerpt": "政府は愛国心の醸成を目的として本法の周知、適用等をする考えはないという理解でよいか、見解を示されたい。", "question_plain": "「この法律で愛国心を醸成する」という提出者の発言があったが、政府は愛国心醸成を目的にした運用はしない、と確認してよいか。", "answer_section": "二十について", "answer_excerpt": "お尋ねの「愛国心の醸成を目的として本法の周知、適用等をする」の意味するところが必ずしも明らかではないが、政府として、国会における審議の内容等も踏まえ、本法の適切な運用がなされるよう、本法の趣旨及び内容を周知徹底してまいりたい。", "answer_plain": "「しない」という否定の言質は与えず、「適切な運用のために周知徹底する」とだけ答えた。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 30, "commentary": "「〜しないという理解でよいか」という否定の確認質問に対し、肯定も否定もしない答え方。愛国心醸成を目的とした運用を否定する一文を入れることは容易だったはずで、あえて言質を避けたと読める締めくくり。", "good_point": null}], "overall": {"score": 42, "grade": "D", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "「議員立法だから立場にない」を盾に合憲性は語らず——警察通達の開示など実務情報は出した", "axes": {"responsiveness": {"label": "回答充足度", "score": 42, "note": "20問中、正面回答は事実確認・実務系に偏り、憲法論はほぼ空白"}, "specificity": {"label": "具体性", "score": 50, "note": "通達の発番号・実例法令名は具体的。憲法論は引用のみ"}, "evidence": {"label": "根拠の提示", "score": 40, "note": "政府自身の判断根拠は乏しく、提出者答弁への依存が大きい"}, "clarity": {"label": "明瞭さ", "score": 55, "note": "構成は整理されているが、長文引用の繰り返しで実質が薄まる"}}, "strengths": ["警察庁の2本の通達を発番号・日付・指示内容まで特定して開示し、処罰範囲の判断例集（衆理事懇資料）が全国警察に示された事実を公式に確認した", "違法運用が国家賠償の対象になり得ることを条文に即して確認した（十九）", "予防目的立法の実例（クローン技術規制法等）や「その他の客観的な事情」の意味など、答えられる設問には具体的に答えた"], "weaknesses": ["執行する法律の合憲性（19条・21条・31条）について、「誠実に執行する責務があるから答えない」という転倒した理屈で政府自身の見解を一切示さなかった", "両院の附帯決議を運用にどう反映するかという政府所管の事項まで「一概に困難」で流した（十五）", "「愛国心醸成を目的とした運用はしない」という否定の確認に言質を与えなかった（二十）"]}, "question_quality": {"score": 85, "comment": "衆理事懇資料・附帯決議・委員会答弁・国家公安委員長会見を精密に引用し、「立法の当否」ではなく「執行政府の運用責任」に照準を絞った設計は、議員立法への質問主意書の型として完成度が高い。冒頭で「議員立法だからと留保するな」と予防線を張った点も、実際に多用された「立場にない」の不自然さを際立たせる効果を持った。20問という分量が一括答弁を誘発した面はあるが、事実確認（七・十二）を挟んで逃げ道を塞ぐ構成は機能している。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持、および国旗損壊罪という法律自体の当否への立場を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "sangiin-221-111", "source": {"title": "日本国憲法における象徴天皇制の在り方等に関する質問主意書", "house_label": "参議院", "session": 221, "number": 111, "submitter": "小西洋之", "submitted_on": "令和8年7月24日", "answered_on": "令和8年8月4日", "answerer_name": "高市早苗", "answerer_title": "内閣総理大臣", "note": "国会法第75条第2項により答弁延期（8月4日まで）", "urls": {"meisai": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/221/meisai/m221111.htm", "question": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/221/syuh/s221111.htm", "answer": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/221/touh/t221111.htm"}}, "topic_tags": ["象徴天皇制", "憲法", "皇位継承", "歴史認識"], "glossary": [{"term": "象徴天皇制", "definition": "憲法1条「天皇は、日本国の象徴であり日本国民統合の象徴であつて、この地位は、主権の存する日本国民の総意に基く」が定める制度。天皇の地位の根拠を「国民の総意」に置くのが戦後憲法の核心。"}, {"term": "内閣の助言と承認", "definition": "憲法上、天皇の国事に関する行為はすべて内閣の助言と承認を必要とする（憲法3条）。天皇の記者会見での発言がこれに基づくものかどうかは、発言の性格（公的か私的か）に関わる論点。"}, {"term": "男系継承", "definition": "父方をたどると歴代天皇に行き着く血統による皇位継承。「126代にわたり男系で継承されてきた」という言説が皇位継承議論の前提とされることが多いが、初期の天皇の実在性は歴史学上確認されていない。"}, {"term": "皇紀", "definition": "日本書紀の記述から神武天皇が即位したとされる年（紀元前660年）を元年とする紀年法。明治5年の太政官布告で定められた。"}], "tldr": ["質問者は、憲法1条の趣旨、天皇陛下の会見発言の位置づけ、そして「126代男系継承は歴史的事実か」「歴史的事実として確認できる初代天皇は誰か」という、高市首相の党総裁としての発言を意識した歴史認識の確認を6問ぶつけた。", "政府は憲法1条の趣旨は歴代の内閣法制局長官答弁の引用で丁寧に答えた一方、「歴史的事実か」という問いにはすべて「『歴史的事実』の意味するところが必ずしも明らかではない」と前置きし、「日本書紀を始めとする史料に基づけば」という限定つきの認識に置き換えた。", "興味深いのは書き分けで、男系継承については「皇位は例外なく男系で継承されてきたものと認識」とやや踏み込み、桓武天皇の生母が百済系という上皇陛下も言及した事項については「続日本紀は…と記述していると認識」と、史料の記述の存在だけを認める距離の取り方をした。"], "question_overview": "①憲法1条の「象徴」「国民の総意」の趣旨、②象徴天皇制と憲法の基本原理の整合、③天皇陛下の会見発言（皇族数確保の議論への言及）は内閣の助言と承認に基づくものか、④高市首相が党総裁として述べた「126代男系継承は歴史的事実」を政府としても認めるか、⑤「皇紀」の定義と歴史的事実として確認できる初代天皇、⑥上皇陛下が言及された「桓武天皇の生母は百済武寧王の子孫」は歴史的事実か——首相の政治的発言と歴史学・宮内庁的公式見解の間の緊張を突く設計。", "answer_overview": "憲法1条の趣旨（一）は昭和の内閣法制局長官答弁2件の引用で正面から回答。陛下の会見発言（三）は「自らのお考えを述べられたもの」として国事行為性を事実上否定しつつ、政府の受け止めは差し控えた。歴史認識系の3問（四〜六）はいずれも「『歴史的事実』の意味が明らかでない」と前置きした上で、「日本書紀を始めとする史料に基づけば」神武天皇以来126代例外なく男系継承と「認識」（四）、「日本書紀に基づけば」初代は神武天皇と「認識」（五）、「続日本紀は…記述していると認識」（六）と、問われた「歴史的事実か」を「史料にどう書かれているか」に置き換えて答えた。", "items": [{"q_id": "一", "question_excerpt": "「日本国の象徴」及び「日本国民統合の象徴」並びに「日本国民の総意に基く」の趣旨について、政府の見解を具体的に示されたい。", "question_plain": "憲法1条の「象徴」と「国民の総意に基づく」とは、政府の解釈ではどういう意味か。", "answer_section": "一について", "answer_excerpt": "昭和六十年三月十一日の参議院予算委員会において、茂串内閣法制局長官（当時）が「…天皇の御存在を通じてそこに日本国の姿を見ることができる、また日本国民統合の姿を見ることができるという日本国民全体の信念をあらわしたものであると考えております。…」と答弁したとおりである。…いわゆる総体としての国民の意思が、象徴である天皇の地位の根拠となることを意味するものと解される。", "answer_plain": "歴代の内閣法制局長官の答弁を2件引用し、確立した政府解釈として趣旨を説明した。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 70, "commentary": "過去答弁の引用ではあるが、憲法解釈のように確立した政府見解を問う設問では、先例の引用はむしろ正統な回答方法。「〜と解される」と現在の政府の解釈として引き取ってもいる。", "good_point": "確立した憲法解釈を出典（答弁者・日付）つきで示し、現在も維持されていることを明確にした。"}, {"q_id": "二", "question_excerpt": "象徴天皇制の在り方は、憲法の国民主権、基本的人権の尊重、平和主義の基本原理の趣旨と整合することが求められるべきものであるか…また、憲法の定める象徴天皇制が体現すべき価値とはどのようなものであると認識しているか。", "question_plain": "象徴天皇制は憲法の三大原理と整合すべきものか。象徴天皇制が体現すべき価値とは何か。", "answer_section": "二について", "answer_excerpt": "…意味するところが必ずしも明らかではないが、憲法の各規定については、調和が保たれた形で理解されるべきものであると考えている。…お尋ねの「象徴天皇制」の意義については、…菅内閣官房長官（当時）が…答弁したとおりである。", "answer_plain": "「各規定は調和が保たれた形で理解されるべき」という一般論と、過去の官房長官答弁の引用。「体現すべき価値」への直接の回答はない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 40, "commentary": "「調和が保たれた形で理解されるべき」は整合性の問いへの間接的な肯定とも読めるが、「体現すべき価値」という規範的な問いは引用で流された。抽象度の高い設問ではあるものの、回答の実質は薄い。", "good_point": null}, {"q_id": "三", "question_excerpt": "この御発言は内閣の助言と承認に基づくものなのかについて示されたい。また、この御発言を政府としてどのように受け止められているかについて見解を示されたい。", "question_plain": "天皇陛下が会見で皇族数確保の議論に触れられた発言は、内閣の助言と承認に基づく公的なものか。政府はどう受け止めたか。", "answer_section": "三について", "answer_excerpt": "お尋ねの令和八年六月十一日の記者会見における天皇陛下の御発言については、天皇陛下が自らのお考えを述べられたものと受け止めており、政府としての見解を述べることは差し控えたい。", "answer_plain": "「自らのお考えを述べられたもの」＝内閣の助言と承認に基づく国事行為ではない、と実質的に答えた。受け止めについては差し控え。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P2", "label": "差し控え型"}], "responsiveness": 50, "commentary": "前段には「自らのお考え」という表現で実質的に答えている（助言と承認に基づくものではない、という整理）。後段の「受け止め」の差し控えは、天皇の政治利用を避ける配慮として一定の合理性があるが、制度論としての受け止め（皇族数確保議論との関係）まで封じた点は議論が残る。", "good_point": "陛下の発言の法的位置づけ（国事行為ではない）を、婉曲ながら明確に整理した。"}, {"q_id": "四", "question_excerpt": "政府として、百二十六代にわたって、あるいは、二千六百年以上にわたって男系で皇統が継承されてきたことを歴史的事実と認識しているかについて、政府の見解を示されたい。", "question_plain": "高市首相が党総裁として「126代男系継承は歴史的事実」と発言したが、政府としても「歴史的事実」と認識しているのか。", "answer_section": "四について", "answer_excerpt": "お尋ねの「歴史的事実」の意味するところが必ずしも明らかではないが、「日本書紀」を始めとする史料に基づけば、紀元前六百六十年二月十一日に当たる日に即位した神武天皇より、百二十六代にわたって、皇位は例外なく男系で継承されてきたものと認識している。", "answer_plain": "「歴史的事実」という言葉の意味は不明としつつ、「日本書紀を始めとする史料に基づけば」という限定つきで「126代例外なく男系継承と認識」と答えた。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P6", "label": "指標すり替え型"}], "responsiveness": 55, "commentary": "質問の核心は「歴史学上の事実として認めるのか、それとも記紀の記述にすぎないのか」の区別であり、答弁は「史料に基づけば…認識」という表現でその区別自体を回避した。紀元前660年の神武天皇即位を含む記述を「史料に基づけば」と政府答弁書に書き込んだ点で、首相の総裁発言を実質的に追認しつつ、「歴史的事実」という言葉だけは引き受けない、二重に慎重な作文。", "good_point": null}, {"q_id": "五", "question_excerpt": "政府としては「皇紀」を定義しているか。…また、政府としては、歴史的事実として確認できる初代の天皇は誰であると認識しているのかについて説明されたい。", "question_plain": "「皇紀」は政府の公式な定義があるのか。歴史学的に確認できる最初の天皇は誰だと政府は考えているのか。", "answer_section": "五について", "answer_excerpt": "お尋ねの「皇紀」については、「神武天皇御即位ヲ以テ紀元ト被定候」とする明治五年太政官布告第三百四十二号があることは承知している。また、お尋ねの「歴史的事実」の意味するところが必ずしも明らかではないが、「日本書紀」に基づけば、初代の天皇は神武天皇であると認識している。", "answer_plain": "皇紀は明治の太政官布告の存在を「承知」と答え、初代天皇は「日本書紀に基づけば神武天皇」と回答。「歴史的事実として確認できる」という問いの限定は外された。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P6", "label": "指標すり替え型"}], "responsiveness": 45, "commentary": "質問者は「歴史的事実として確認できる初代」を聞いており、これは歴史学で実在が確認される天皇（記紀上の神武天皇とは別の論点）を示せという趣旨が明白。答弁は問いの限定を「日本書紀に基づけば」に差し替えて神武天皇と答えており、聞かれたことと違うことに答える指標すり替えの典型。皇紀については布告の「存在の承知」のみで、現在の政府として定義しているか否かは答えていない。", "good_point": null}, {"q_id": "六", "question_excerpt": "政府として、桓武天皇の生母が百済の武寧王の子孫であるという事項は歴史的事実であると認識しているか、政府の歴史的な評価に係る見解を示されたい。", "question_plain": "上皇陛下も会見で言及された「桓武天皇の生母は百済の武寧王の子孫」を、政府は歴史的事実と認識しているか。", "answer_section": "六について", "answer_excerpt": "お尋ねの「歴史的事実」の意味するところが必ずしも明らかではないが、「続日本紀」は桓武天皇の御生母である高野新笠の祖先について「出自百済武寧王之子純陀太子」と記述していると認識している。", "answer_plain": "「続日本紀にそういう記述がある」ことだけを認め、事実としての認識は示さなかった。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P6", "label": "指標すり替え型"}], "responsiveness": 35, "commentary": "四と六を並べると書き分けが際立つ。男系継承（四）は「史料に基づけば…皇位は例外なく男系で継承されてきたものと認識」と事実命題の形で述べたのに対し、百済とのゆかり（六）は「続日本紀は…記述していると認識」と、史料の記述の存在の認識にとどめた。同じ「史料に基づく認識」を問われて、命題ごとに距離の取り方を変えており、質問者が仕掛けた一貫性テストに対して非対称な回答をしたことが記録に残った。", "good_point": null}], "overall": {"score": 49, "grade": "D", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "「史料に基づけば」の使い分け——男系継承は「認識」、百済ゆかりは「記述がある」止まり", "axes": {"responsiveness": {"label": "回答充足度", "score": 48, "note": "憲法解釈は正面回答、歴史認識は限定つきの置き換え"}, "specificity": {"label": "具体性", "score": 55, "note": "引用・出典は具体的。核心の「歴史的事実か」は最後まで曖昧"}, "evidence": {"label": "根拠の提示", "score": 50, "note": "法制局答弁・史料名の提示はあるが、書き分けの理由は示されない"}, "clarity": {"label": "明瞭さ", "score": 55, "note": "「史料に基づけば」の限定の意味が意図的に多義的"}}, "strengths": ["憲法1条の趣旨を、確立した内閣法制局長官答弁の引用で出典つきに正面から示した", "天皇陛下の会見発言について「自らのお考えを述べられたもの」と法的位置づけを整理した", "歴史認識の設問でも、依拠する史料名（日本書紀・続日本紀）と記述内容を特定して答えた"], "weaknesses": ["「歴史的事実か」という問いを4回すべて「意味が明らかでない」と前置きし、「史料に基づけば」という別の位相の命題に置き換えた", "「歴史的事実として確認できる初代の天皇」という歴史学上の問いに、「日本書紀に基づけば神武天皇」と問いの限定を外して答えた", "男系継承（四）と百済とのゆかり（六）で「認識している」の踏み込み方を非対称に書き分け、その理由を説明していない"]}, "question_quality": {"score": 80, "comment": "首相の党総裁としての発言、上皇陛下の会見発言という公的な言明同士を対置し、「政府として同じ基準で答えられるか」を試す一貫性テストの設計が秀逸。実際に答弁書の書き分け（四と六の非対称）を引き出し、それ自体を公式記録として残すことに成功している。「歴史的事実」という語の学術的定義を示さずに使ったため、「意味が明らかでない」という前置きの余地を与えた点だけが惜しい。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持、皇位継承の在り方に関する立場を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "sangiin-221-112", "source": {"title": "皇室典範の改正による皇位継承及び養子制度の憲法問題等に関する質問主意書", "house_label": "参議院", "session": 221, "number": 112, "submitter": "小西洋之", "submitted_on": "令和8年7月24日", "answered_on": "令和8年8月4日", "answerer_name": "高市早苗", "answerer_title": "内閣総理大臣", "note": "国会法第75条第2項により答弁延期（8月4日まで）", "urls": {"meisai": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/221/meisai/m221112.htm", "question": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/221/syuh/s221112.htm", "answer": "https://www.sangiin.go.jp/japanese/joho1/kousei/syuisyo/221/touh/t221112.htm"}}, "topic_tags": ["皇室典範改正", "皇位継承", "法の下の平等", "憲法"], "glossary": [{"term": "皇室典範改正（養子制度）", "definition": "皇族数の減少に対応するため、2026年（令和8年）の皇室典範等改正で、旧11宮家の男系男子が皇族の養子になれる制度が導入された。養子自身は皇位継承資格を持たないが、養子の「子」（生まれながらの皇族となる男子）は現行規定の適用により継承資格を持つことになった。"}, {"term": "衆参正副議長による議論のとりまとめ", "definition": "皇族数確保策について各党の協議を衆参の正副議長がまとめた文書。「皇位継承の問題とは切り離して皇族数を確保する」という前提で議論されており、養子の子の継承資格については記載がなかった。この「空白」の扱いが本件の争点。"}, {"term": "門地による差別（憲法14条）", "definition": "憲法14条1項は「門地」（家柄・血筋）による差別を禁止する。旧宮家出身の男系男子だけが養子になれる制度がこれに当たるかが、改正審議の憲法上の最大の論点だった。"}], "tldr": ["皇室典範改正で導入された養子制度について、質問者は「皇族数確保のためと説明された制度なのに、養子の子には皇位継承資格が生じる。適用除外を置けたはずなのに、なぜ置かなかったのか」という制度設計の核心と、旧宮家男子のみを対象とする憲法14条（門地差別）問題を10問で質した。", "政府は大半を官房長官・内閣法制局長官の国会答弁の引用で処理。「養子の子は生まれながらの皇族だから現行規定が適用される」という仕組みの説明は繰り返したが、「なぜ適用除外を設けなかったのか」という理由の説明には最後まで答えなかった。", "一方、皇族の範囲の法律委任の憲法上の根拠を問われた設問には、憲法1条・2条・4条2項・5条・8条と条文を列挙して答えており、法制論の外枠では実質的な回答もある。"], "question_overview": "①皇位継承資格の在り方は象徴天皇制の根幹か、②養子の子孫の継承資格は憲法1条の「国民の総意」に基づくべき事項か、③〜⑥有識者会議報告書も衆参正副議長のとりまとめも「皇位継承と切り離した皇族数確保策」として整理していたのに、養子の子に継承資格が生じる設計とした理由、適用除外を措置しなかった理由、男系男子維持の目的があったのではないか、⑦〜⑨旧11宮家出身の男系男子のみを養子資格者とすることの憲法14条（性別・門地差別）適合性、⑩改正法附則の見直し条項の射程——立法過程の経緯を精密に踏まえて制度設計の説明責任を問う構成。", "answer_overview": "「意味するところが必ずしも明らかではない」の前置きと、木原官房長官・岩尾内閣法制局長官の委員会答弁の引用が答弁の大半を占める。「養子の子は生まれながらの皇族だから現行の1条・2条が適用される」という仕組みの説明（三〜六への一括答弁）は詳しいが、質問の核心である「適用除外を置かなかった理由」「男系維持の目的の有無」への直接の回答はない。憲法14条関係は「天皇・皇族は14条の例外」という確立解釈の引用で処理。皇族の範囲の法律委任の根拠条文（八）だけは、憲法の5つの条文を挙げて政府自身の解釈として答えた。", "items": [{"q_id": "一・二", "question_excerpt": "政府は、皇位継承資格の在り方は象徴天皇制の根幹に関わる事項であると考えているか。（二では、養子皇族男子の子孫の継承資格は憲法1条の「日本国民の総意に基く」べき事項かを、理由とともに質問）", "question_plain": "誰が皇位を継げるかのルールは象徴天皇制の根幹であり、「国民の総意」に基づいて決めるべき事項ではないのか。", "answer_section": "一及び二について（一括答弁）", "answer_excerpt": "お尋ねの「象徴天皇制の根幹に関わる事項」の意味するところが必ずしも明らかではないが、憲法第一条は、天皇の地位が国民の総意に基づくものと規定しており、皇位継承の在り方については、国家の基本に関わる事柄であると考えている。", "answer_plain": "「国家の基本に関わる事柄」という一般的な表現に言い換えて答えた。「総意に基づくべき事項か」への直接の回答と理由の説明はない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P5", "label": "まとめ答弁型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 35, "commentary": "「根幹に関わる」を「国家の基本に関わる」に言い換えることで、質問者の用意した土俵（根幹事項なら総意に基づくべき→今回の改正はそれを満たすか、という三段論法）に乗ることを避けた。二の「なぜそう考えるのか」という理由の要求は完全に流されている。", "good_point": null}, {"q_id": "三〜六", "question_excerpt": "政府において、養子皇族男子の子孫について皇室典範第二条が適用されることがないようにするなど適用除外の規定を措置するべきであり、かつそうすることが可能であったと考えるが、当該適用除外の規定を措置しなかった理由について具体的に説明されたい。（六では、男系男子のみによる天皇制を維持する目的があったのではないかと質問）", "question_plain": "「皇族数確保のための制度」という建て付けなら、養子の子に継承資格が生じないよう適用除外を置けたはず。なぜ置かなかったのか。男系維持が本当の目的だったのではないか。", "answer_section": "三から六までについて（一括答弁）", "answer_excerpt": "…木原内閣官房長官が「…養子の子は生まれながらの皇族でありますから、男子の場合は現行の皇室典範、これ第一条と第二条が適用され、皇位継承資格を有します。…順序に紛れがあってはいけませんので、そういったことを生じないようにするという趣旨での解釈規定でございますので、何か新しく規定をしたというものではございません」と答弁しているとおりである。", "answer_plain": "「養子の子は生まれながらの皇族だから現行規定が適用される」という仕組みの説明（官房長官答弁の引用）のみ。「なぜ適用除外を置かなかったのか」の理由にも、「男系維持の目的があったのか」にも答えていない。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P4", "label": "過去答弁引用型"}, {"code": "P5", "label": "まとめ答弁型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 25, "commentary": "この質問主意書の核心部分。質問者は「現行規定が適用される仕組みになっている」ことは前提として認めた上で、「適用除外を置くという立法上の選択をしなかった理由」を問うている。引用された官房長官答弁は仕組みの説明であって理由の説明ではなく、問いと答えが噛み合っていない。4問を一括りにしたことで、六の目的への問い（政策動機の確認）も一緒に消えた。", "good_point": null}, {"q_id": "七", "question_excerpt": "日本国憲法第十四条第一項は、法律によって特定の門地に属する国民のみに特定の地位や権能を与えることを禁止していると解しているか…仮に…許されることがあると考える場合は、どのような場合がそれに該当すると考えるか。", "question_plain": "「家柄」で特定の国民だけに特別な地位を与えることを、憲法14条は禁止していないのか。例外があるならどんな場合か。", "answer_section": "七について", "answer_excerpt": "…木村内閣法制局第一部長（当時）が「…憲法は、天皇、皇族につきまして、一般国民と異なる特殊な地位を認めていると解されます。かかる地位は、憲法第十四条に規定する門地による差別の例外であると考えられます」及び「…その範囲は、法律の定めるところにより委ねられているというふうに考えております」と答弁したとおりである。", "answer_plain": "「天皇・皇族は憲法自身が認めた14条の例外」という確立解釈を、法制局答弁の引用で示した。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 60, "commentary": "一般論の設問に対し、確立した政府解釈（皇族制度は14条の例外）を出典つきで示しており、回答として成立している。ただし「例外」の範囲がどこまで法律に委ねられるのか——まさに次の八・九で問われる核心——への踏み込みはこの時点では留保されている。", "good_point": "門地差別禁止の例外という確立解釈の枠組みを、出典つきで明示した。"}, {"q_id": "八", "question_excerpt": "具体的に憲法のどの条文により皇室典範に委任されているのか政府の見解を示されたい。また、仮に…憲法第二条を根拠とする場合は…皇位継承ではなく「皇族数確保」を目的とした皇室典範による制度を設けることについて、憲法第二条を根拠とすることは…趣旨の逸脱行為であり…門地による差別に該当する憲法違反ではないのか。", "question_plain": "皇族の範囲を法律で決められるという委任の根拠は憲法の何条か。皇位継承のためではない「皇族数確保」の制度を2条で正当化するのは筋違いで、旧宮家出身者だけの養子制度は門地差別にならないか。", "answer_section": "八について", "answer_excerpt": "憲法第一条、第二条、第四条第二項、第五条及び第八条の規定を踏まえ、憲法に具体的な定めが置かれていない皇族の範囲については、法律に委ねられている事項であると解しているものである。", "answer_plain": "委任の根拠として憲法の5つの条文を列挙して答えた。後段の「2条根拠なら趣旨逸脱・14条違反では」という追い込みには答えていない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P8", "label": "論点スルー型"}], "responsiveness": 55, "commentary": "前段には条文を特定して答えており、「単一の条文（2条）ではなく複数条文の総体を根拠とする」という整理で、質問者の「2条単独根拠なら逸脱」という追い込みを構造的にかわした。技術的には巧みだが、そのかわし方によって後段の憲法違反の疑いへの直接の応答は消えている。", "good_point": "委任の憲法上の根拠を5つの条文で特定して示した。答弁書全体で最も明確な政府自身の解釈の提示。"}, {"q_id": "九", "question_excerpt": "一般国民の中で旧十一宮家の出自の男系男子のみを養子の資格者とすることは、…憲法第十四条第一項において、性別と門地による差別になるのではないのか、また、憲法違反の問題は生じないのか。", "question_plain": "旧宮家出身の「男系男子」だけが養子になれる制度は、性別と家柄による差別で憲法違反ではないのか。", "answer_section": "九について", "answer_excerpt": "…岩尾内閣法制局長官が「…今般の養子の対象者は、日本国憲法及び現行皇室典範の施行後も皇族の身分を有していた皇族男子の子孫である男系男子であることから、門地による差別を禁止した憲法第十四条の規定に反するものではないと考えているところでございます」と答弁しているとおりである。", "answer_plain": "「14条に反しない」とする法制局長官の国会答弁の引用で回答。「性別」による差別の論点には触れていない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 50, "commentary": "門地差別については「反しない」という結論と一応の理由（皇族の身分を有していた皇族男子の子孫であること）が引用で示された。ただし質問が明示的に並記した「性別」による差別の論点は、引用にも答弁書本体にも現れず、応答が半分欠けている。", "good_point": null}, {"q_id": "十", "question_excerpt": "附則第六条第一項の「それぞれの法律」が意味する法律が何であるかについて説明されたい。また、同条の「それぞれの法律の規定」には、皇室典範第一条、第二条及び第三十八条第六項は含まれるのかをそれぞれに示した上で…説明されたい。", "question_plain": "改正法の「見直し条項」の対象に、皇位継承資格を定める条文は含まれるのか。含まれないなら、養子の子の継承資格は今後の見直しの対象外なのか。", "answer_section": "十について", "answer_excerpt": "…木原内閣官房長官が「改正法の附則第六条第一項ですが、改正後の各法律の規定全般について必要があると認められれば随時見直しが行われるという趣旨の規定であると認識しております」と答弁しているとおりである。", "answer_plain": "「各法律の規定全般が見直しの対象」という官房長官答弁の引用。条文を「それぞれに示した上で」という要求には応じていない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 45, "commentary": "「規定全般」という引用から、問われた各条文も見直し対象に含まれると読み取ることは可能で、実質的な情報は伝わっている。ただし「それぞれに示した上で」という明示の要求に対して条文ごとの回答を避けており、将来「あの条文は対象外」と言い換える余地を残した書き方でもある。", "good_point": null}], "overall": {"score": 41, "grade": "D", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "「なぜ適用除外を設けなかったのか」には最後まで答えず——仕組みの説明で理由の説明を代替", "axes": {"responsiveness": {"label": "回答充足度", "score": 42, "note": "核心の三〜六が実質ゼロ。外枠の法制論は回答あり"}, "specificity": {"label": "具体性", "score": 50, "note": "根拠条文の列挙は具体的。理由・目的の説明は皆無"}, "evidence": {"label": "根拠の提示", "score": 45, "note": "確立解釈の引用は多いが、今回の立法判断の根拠は示されない"}, "clarity": {"label": "明瞭さ", "score": 55, "note": "引用中心で、答弁書単体では論旨を追いにくい"}}, "strengths": ["皇族の範囲の法律委任について、憲法1条・2条・4条2項・5条・8条と根拠条文を特定して政府自身の解釈を示した（八）", "門地差別に関する確立解釈（天皇・皇族は14条の例外）を出典つきで整理した（七）", "見直し条項について「規定全般が対象」という射程の広い解釈を引用の形で確認した（十）"], "weaknesses": ["質問の核心である「適用除外を措置しなかった理由」に、仕組みの説明（現行規定が適用される）を繰り返すだけで一度も答えなかった（三〜六）", "「男系男子維持の目的があったのではないか」という立法動機の確認を、一括答弁の中で無応答のまま消化した（六）", "「性別」による差別の論点（九）と「条文ごとに示せ」という要求（十）など、設問の明示的な要求の一部を黙って落とした"]}, "question_quality": {"score": 80, "comment": "有識者会議報告書・衆参正副議長とりまとめ・委員会答弁という立法過程の一次資料を精密に踏まえ、「皇族数確保と説明された制度から皇位継承資格が生じる」という制度設計の矛盾に照準を絞った法制論として完成度が高い。「仮に2条を根拠とする場合は」と政府の答え方を先回りして塞ぐ設計も効いている（実際、政府は複数条文列挙でかわした）。一方、一つの設問に長い前提説明を織り込む文体が、一括答弁と論点の選択的な無視を許しやすくした面はある。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持、皇位継承の在り方に関する立場を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "shugiin-193-105", "source": {"title": "内閣総理大臣夫人の法的地位に関する質問主意書", "house_label": "衆議院", "session": 193, "number": 105, "submitter": "逢坂誠二", "submitted_on": "平成29年3月3日", "answered_on": "平成29年3月14日", "answerer_name": "安倍晋三", "answerer_title": "内閣総理大臣", "urls": {"meisai": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/193105.htm", "question": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a193105.htm", "answer": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b193105.htm"}}, "topic_tags": ["森友問題", "総理夫人", "公人・私人"], "glossary": [{"term": "「私人」閣議決定", "definition": "この質問主意書への答弁書（2017年3月14日閣議決定）に含まれた「（内閣総理大臣夫人は）公人ではなく私人であると認識している」という一文のこと。森友学園の小学校の名誉校長を務めていた昭恵氏の立場が国会で問われるなか、「私人」を閣議決定したとして大きく報道された。"}, {"term": "総理公務補助", "definition": "この答弁書で政府が定義した言葉。総理大臣夫人が「内閣総理大臣の公務の遂行を補助すること」を指し、これを支援する職員が内閣官房に置かれている（当時、専従2名＋併任3名）。"}, {"term": "大臣規範", "definition": "「国務大臣、副大臣及び大臣政務官規範」（2001年閣議決定）。大臣等の守秘義務や行動規範を定めるが、総理夫人には適用されない。質問はこの「守秘義務の穴」を突いている。"}, {"term": "質問主意書", "definition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["森友問題で総理夫人の立場が焦点になるなか、質問者は「夫人の地位は法令上規定されているか」「公人か私人か」「付いている職員5名の法的根拠は」「守秘義務がないのに機密はどう守るのか」「制度化すべきでは」の7点を体系的に質した。", "政府は「夫人の呼称に法令上の定めはない」「公人ではなく私人であると認識」と明言し、職員についても内閣法12条2項1号を根拠に専従2名＋併任3名という構成まで開示した——答弁書としては珍しく定義・根拠・数字が揃っている。", "一方、守秘義務の穴を突いた問六だけは「仮定の質問」として回答を拒否。「私人」の結論が世論の批判を浴びたが、答弁の応答性だけを見ると平均よりかなり誠実な部類に入る、という評価と世論のねじれが興味深いケース。"], "question_overview": "「妻は総理夫人と呼ばれるが役職があるわけではない」という首相答弁を起点に、①現行法令上の地位の有無、②〜④公人か私人か・その定義、⑤夫人付き職員5名の所属と法令上の根拠、⑥守秘義務がない夫人が首脳会合等に同席した場合の機密保護の方法、⑦法的地位を付与する制度化の必要性、と論点を段階的に積み上げた設計。ファーストレディ外交の意義を認めたうえで制度の穴を問う、対決型ではなく制度論型の質問。", "answer_overview": "「内閣総理大臣夫人」は呼称であり法令上の定めはないとし（一）、「公人とは一般に公職にある人」という定義を示したうえで「公人ではなく私人であると認識している」と明言（二〜四）。夫人付き職員については内閣法第12条第2項第1号を根拠に、内閣官房の専従2名＋各省庁からの併任3名という構成を開示した（五）。他方、守秘義務の穴を問うた六は「仮定の御質問」として差し控え、「適切な情報管理を行ってきている」の一般論のみ。制度化の要否（七）は「総理公務補助は適切に行われている」として実質的に否定した。", "items": [{"q_id": "一", "question_excerpt": "現行法令上、内閣総理大臣夫人の地位は規定されているのか。見解を示されたい。", "question_plain": "「総理夫人」という立場は、法律のどこかに定められているのか？", "answer_section": "一について", "answer_excerpt": "お尋ねの「地位」の意味するところが必ずしも明らかではないが、御指摘の「内閣総理大臣夫人」とは、内閣総理大臣の配偶者を指して一般的に用いられる呼称であり、当該呼称についての法令上の定めはない。", "answer_plain": "「趣旨が明らかでない」と前置きしつつ、「法令上の定めはない」と正面から答えた。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 80, "commentary": "「法令上の定めはない」という明確な回答。冒頭の趣旨不明の前置きは、直後に問題なく答えられていることと整合せず定型句の域を出ないが、回答の実質は損なわれていない。", "good_point": "問いの核心（法的根拠の不存在）を認める回答を明文で行った。"}, {"q_id": "二〜四", "question_excerpt": "内閣総理大臣夫人は、「公人」であるのか。ないとすれば「私人」であるのか。政府の見解を示されたい。（三・四では「公人ではない」という理解の確認と、「公人」の定義を要求）", "question_plain": "総理夫人は「公人」なのか「私人」なのか。首相が言う「公人ではない」の意味と、「公人」の定義もはっきりさせてほしい。", "answer_section": "二から四までについて（一括答弁）", "answer_excerpt": "公人とは、一般に、公職にある人を意味するものと承知しており、他方、私人とは、一般に、公人の対義語として用いられるものと承知している。その意味で「内閣総理大臣夫人」は、公人ではなく私人であると認識している。", "answer_plain": "「公人＝公職にある人」という定義を示したうえで、「総理夫人は公人ではなく私人」と断言した。これが世に言う「私人」閣議決定。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 75, "commentary": "定義を示し、結論を明言しており、応答性の観点では正面回答に当たる。3問の一括処理だが、いずれの問いにも実質的に答えている。ただし「役職・辞令がないから私人」という形式論に立っており、公費で職員が付き公務を補助するという実態（問五で政府自身が認めた事実）とどう整合するのかという実質論には踏み込んでいない。その緊張関係が後の問六・七で露呈する。", "good_point": "曖昧にせず「公人ではなく私人」と断言した。この明言が公式記録として残ったため、以後の国会論戦や報道の基準点になった（結論への賛否とは別に、言質としての価値は大きい）。"}, {"q_id": "五", "question_excerpt": "安倍内閣総理大臣夫人には、「サポートする職員を全体として五名配置している」…これらの職員の現時点の所属とその職務に係る法令上の根拠はどのようなものか。見解を示されたい。", "question_plain": "夫人に付いている職員5名は、どこの所属で、何の法律に基づいて働いているのか？", "answer_section": "五について", "answer_excerpt": "内閣法（昭和二十二年法律第五号）第十二条第二項第一号に規定する内閣の庶務を担当する内閣官房の職員として、…総理公務補助…を支援する職員二名を内閣官房に置いているほか、日常的には各省庁で勤務しているが、…必要に応じ支援する職員三名を内閣官房に併任させている。", "answer_plain": "内閣法12条2項1号（内閣の庶務）を根拠に、専従2名＋各省庁からの併任3名という構成を具体的に開示した。", "verdict": "answered", "verdict_label": "回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}], "responsiveness": 85, "commentary": "条文の特定、職員の構成（専従2・併任3）、勤務実態まで示した具体性の高い回答。「総理公務補助」という概念をここで定義したことも、以後の森友国会での論戦の土台になった。冒頭の趣旨不明の前置きは例によって形式的。", "good_point": "法令上の根拠を条文番号まで特定し、職員構成の内訳を数字で開示した。答弁書として模範的な部類。"}, {"q_id": "六", "question_excerpt": "「公人ではない」内閣総理大臣夫人が…総理大臣と外国の首脳との会合等に同席しても、…「職務上知ることのできた秘密」を内閣総理大臣夫人が側聞しても、それに守秘義務は課せられないと推察する。かかる場合、政府はどのような方法により、「秘密」を保護しているのか。", "question_plain": "私人である夫人には守秘義務がない。首脳会談などに同席して機密を耳にした場合、政府はどうやって秘密を守っているのか？", "answer_section": "六について", "answer_excerpt": "お尋ねについては、仮定の御質問であることからお答えすることは差し控えたいが、政府としては、適切な情報管理を行ってきている。", "answer_plain": "「仮定の質問」として拒否し、「適切な情報管理を行っている」という中身のない一文を添えた。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P7", "label": "仮定不応答型"}, {"code": "P2", "label": "差し控え型"}], "responsiveness": 15, "commentary": "夫人が首脳外交に同行・同席してきたことは政府自身が認めている公知の事実であり、「仮定の質問」という整理には無理がある。「私人」と断言したことで生じる制度上の穴（守秘義務の不存在）を突いた、この質問主意書の最も鋭い設問が、唯一まともに答えられなかった。「適切な情報管理」の具体的方法もゼロ。二〜五の丁寧さとの落差が、答えたくない論点の所在を逆に照らしている。", "good_point": null}, {"q_id": "七", "question_excerpt": "内閣総理大臣夫人が行ういわゆるファーストレディ外交は意義あるものであり…今後、総理大臣夫人に法的地位を付与するなどの制度化が必要ではないか。政府の見解を示されたい。", "question_plain": "ファーストレディ外交を続けるなら、夫人の立場を法律で整理すべきではないか？", "answer_section": "七について", "answer_excerpt": "お尋ねの「総理大臣夫人に法的地位を付与するなどの制度化」の意味するところが必ずしも明らかではないが、現在のところ、内閣総理大臣の夫人による総理公務補助は適切に行われているものと認識している。", "answer_plain": "「今のやり方で適切にやれている」として、制度化の必要性を実質的に否定した。理由の説明はない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 40, "commentary": "「制度化は不要」という立場は読み取れるが、質問者が指摘した「法的地位が未整理ゆえの不都合」（守秘義務の穴など）への応答がなく、「適切に行われている」の根拠も示されていない。問六を拒否した直後に「適切」と総括する構成は、論証としては循環している。", "good_point": null}], "overall": {"score": 58, "grade": "C", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "「私人」の結論で炎上したが、定義と根拠は示した——穴は守秘義務の問六", "axes": {"responsiveness": {"label": "回答充足度", "score": 60, "note": "7問中、正面回答が多数。問六のみ実質ゼロ"}, "specificity": {"label": "具体性", "score": 65, "note": "条文番号・職員数まで開示。問六・七は空疎"}, "evidence": {"label": "根拠の提示", "score": 55, "note": "内閣法の根拠提示は明確。「適切」の根拠はなし"}, "clarity": {"label": "明瞭さ", "score": 70, "note": "結論は明快。趣旨不明の前置きを3回多用"}}, "strengths": ["「公人ではなく私人」「法令上の定めはない」と、曖昧にせず結論を明言した", "夫人付き職員について内閣法12条2項1号という根拠条文と、専従2名＋併任3名という構成を具体的に開示した", "「総理公務補助」という概念を定義し、以後の国会論戦の共通の土台を作った"], "weaknesses": ["守秘義務の穴を突いた問六を「仮定の質問」として拒否した（夫人の外交同行は公知の事実であり、仮定とは言い難い）", "「役職がないから私人」という形式論と、公費の職員が公務補助を支える実態との整合を説明していない", "「趣旨が明らかでない」という前置きを3つの答弁ブロックで多用した（いずれも直後に回答できている）"]}, "question_quality": {"score": 85, "comment": "首相答弁の引用を起点に、法的地位→公人性→定義→職員の根拠→守秘義務→制度化と論点を段階的に積み上げた、制度論として完成度の高い設計。ファーストレディ外交の意義を認める姿勢を示したことも、対決型でない回答を引き出しやすくした。唯一、問六を「推察する」という仮定形で書いたことが「仮定の質問」という拒否の口実を与えており、「実際に同席した会合での運用を示せ」と事実ベースで問うていればこの逃げ道は塞げた。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "shugiin-193-264", "source": {"title": "「そもそも」の意味として「基本的に」と記載している辞書に関する質問主意書", "house_label": "衆議院", "session": 193, "number": 264, "submitter": "初鹿明博", "submitted_on": "平成29年4月25日", "answered_on": "平成29年5月12日", "answerer_name": "安倍晋三", "answerer_title": "内閣総理大臣", "urls": {"meisai": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/193264.htm", "question": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a193264.htm", "answer": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b193264.htm"}}, "topic_tags": ["国会答弁", "言葉の定義", "共謀罪審議"], "glossary": [{"term": "「そもそも」答弁", "definition": "2017年1月、安倍首相が共謀罪（テロ等準備罪）審議で「そもそも罪を犯すことを目的としている集団でなければ対象にならない」と答弁。後に対象の広がりを指摘されると、4月19日の法務委員会で「『そもそも』には『基本的に』という意味もある。念のために辞書で調べた」と説明を修正し、大きな議論を呼んだ。"}, {"term": "閣議決定答弁書", "definition": "質問主意書への答弁書は閣議決定を経て出される。つまりこの「辞書」答弁は、一大臣の発言ではなく内閣全体の公式見解として決定されたもの。"}, {"term": "質問主意書", "definition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["安倍首相が国会で「『そもそも』には『基本的に』という意味もある。念のために辞書で調べた」と答弁したことを受け、質問者は「本当に調べたのか」「その記載がある辞書名・出版社・出版年を示せ」の2点を質した。", "答弁書は「大辞林（第三版）には『そもそも』について『どだい』等と記述され、この『どだい』について『基本』等と記述されている」という二段の言い換えで応じた。「基本的に」と記載した辞書は示されず、「調べたのか」にも答えなかった。", "この答弁書は閣議決定を経ており、「辞書の伝言ゲーム」として広く報道された。後の再質問への答弁書（第307号）では「お尋ねのような辞書が存在しないかについては承知していない」と、直接の記載の存在を政府自身が示せないことが確定した。"], "question_overview": "共謀罪審議での「そもそも＝基本的に」という首相の説明修正について、①複数の辞書を調べたが該当する記載はなかった、本当に調べたのか、②調べたのなら「そもそも」の意味として「基本的に」と記載している辞書の辞書名・出版社名・出版年を示せ、という事実確認2問に絞った短い質問主意書。出典の特定を求めることで、口頭のその場しのぎを検証可能にする設計になっている。", "answer_overview": "2問を「一及び二について」で一括処理。「例えば」として大辞林第三版を挙げ、「そもそも」の項に「どだい」とあり、「どだい」の項に「基本」とある、という二段構成で「基本的に」への接続を試みた。首相が実際に調べたのかには触れず、問われた「『基本的に』と記載している辞書」そのものは最後まで示されなかった。", "items": [{"q_id": "一", "question_excerpt": "現在出版されている複数の辞書を調べたが、「そもそも」の意味として「基本的に」との記載がある辞書は存在しなかったが、本当に調べたのか。", "question_plain": "首相は「念のために調べた」と国会で言ったが、本当に辞書を調べたのか？", "answer_section": "一及び二について（一括答弁）", "answer_excerpt": "例えば、平成十八年に株式会社三省堂が発行した「大辞林（第三版）」には、「そもそも」について、「（物事の）最初。起こり。どだい。」等と記述され、また、この「どだい」について、「物事の基礎。もとい。基本。」等と記述されていると承知している。", "answer_plain": "「調べたのかどうか」には一切触れず、辞書の記述の紹介に置き換えた。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P5", "label": "まとめ答弁型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 10, "commentary": "「本当に調べたのか」という事実確認への回答はゼロ。首相が国会で「念のために調べてみた」と明言した行為の有無は、答弁の信頼性そのものに関わる検証可能な事実だが、確認も否定もしないまま辞書の内容紹介にすり替えられた。", "good_point": null}, {"q_id": "二", "question_excerpt": "調べている場合、安倍総理が調べた「そもそも」の意味として「基本的に」との記載がある辞書の辞書名、出版社名及び出版年を示されたい。", "question_plain": "「そもそも＝基本的に」と書いてある辞書があるなら、書名・出版社・出版年まで具体的に示してほしい。", "answer_section": "一及び二について（一括答弁）", "answer_excerpt": "例えば、平成十八年に株式会社三省堂が発行した「大辞林（第三版）」には、「そもそも」について、「（物事の）最初。起こり。どだい。」等と記述され、また、この「どだい」について、「物事の基礎。もとい。基本。」等と記述されていると承知している。", "answer_plain": "「そもそも→どだい」「どだい→基本」という二段の言い換えで大辞林を挙げた。ただし問われた「『基本的に』と記載している辞書」ではなく、たどり着いた語も「基本」であって「基本的に」ではない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P6", "label": "指標すり替え型"}], "responsiveness": 30, "commentary": "辞書名・出版社・出版年という形式要件は満たしたが、中身がすり替わっている。問われたのは「そもそも」の項に「基本的に」と記載している辞書であり、示されたのは別の語（どだい）を経由した二段の連想で、終着点も「基本」という別の語。「例えば」という限定も、他に根拠があるかのような含みを残す修辞になっている。もっとも、出典を特定可能な形で示したため第三者の検証が可能になり、実際に再質問（第三〇七号）を招いて、答弁書「お尋ねのような辞書が存在しないかについては承知していない」——直接記載する辞書を政府が示せないこと——が公式記録として確定した。", "good_point": "出典（大辞林第三版・三省堂・平成18年）を特定可能な形で示したこと自体は検証可能性の点で評価できる。その結果、記載の不存在が再質問で明らかになった。"}], "overall": {"score": 18, "grade": "E", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "辞書の伝言ゲームで「基本」を捻出——「調べたのか」には答えず", "axes": {"responsiveness": {"label": "回答充足度", "score": 20, "note": "問一は不応答、問二は問われたものと別の説明"}, "specificity": {"label": "具体性", "score": 45, "note": "出典は書誌情報つきで具体的。ただし問いとズレている"}, "evidence": {"label": "根拠の提示", "score": 25, "note": "示された根拠は二段の言い換えで、主張を直接支えない"}, "clarity": {"label": "明瞭さ", "score": 55, "note": "文章は明瞭だが「例えば」の含みが実態を曖昧にする"}}, "strengths": ["出典を書誌情報（辞書名・出版社・出版年）つきで示したため、第三者による検証が可能だった", "提出から17日で答弁した"], "weaknesses": ["「本当に調べたのか」という事実確認に一切答えなかった", "問われた「『基本的に』と記載している辞書」ではなく、別の語を経由した二段の言い換え（そもそも→どだい→基本）に置き換えた", "この内容が閣議決定を経た内閣の公式見解として出された（再質問への答弁書で、直接記載する辞書を示せないことが確定）"]}, "question_quality": {"score": 75, "comment": "「調べたのか」という事実確認と「書名・出版社・出版年」という出典特定の2問に絞った、検証可能性の高い設計。口頭答弁のその場しのぎを文書で検証するという質問主意書の使い方の好例で、実際に再質問と合わせて「直接記載する辞書は示せない」ことを公式記録化した。問一がやや挑発的な表現である点だけが、正面回答を得にくくした可能性がある。"}, "analysis_note": "この解析はAIによる試作評価です。評価は公開された質問・答弁の全文のみに基づき、提出者・政党・政府への支持・不支持を意味しません。", "analyzed_at": "2026-08-26", "analyzer": "claude (prototype, hand-run)"}, {"id": "shugiin-198-099", "source": {"title": "日ロ平和条約交渉と日米安保条約の関係に関する質問主意書", "house_label": "衆議院", "session": 198, "number": 99, "submitter": "初鹿明博", "submitted_on": "平成31年3月19日", "answered_on": "平成31年3月29日", "answerer_name": "安倍晋三", "answerer_title": "内閣総理大臣", "urls": {"meisai": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/198099.htm", "question": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/a198099.htm", "answer": "https://www.shugiin.go.jp/internet/itdb_shitsumon.nsf/html/shitsumon/b198099.htm"}}, "topic_tags": ["外交", "北方領土", "日米安保"], "glossary": [{"term": "日米安保条約第6条", "definition": "米軍が日本国内の「施設及び区域」を使用できると定める条文。ただし、どの施設・区域を提供するかは日米地位協定に基づく手続で決まる。"}, {"term": "日米地位協定", "definition": "在日米軍の法的地位や基地提供の手続を定める協定。施設・区域の提供は、日米合同委員会を通じた両政府の個別の取極（合意）によるとされており、日本側の合意が手続上の前提になっている（第2条）。"}, {"term": "日ソ共同宣言（1956年）", "definition": "平和条約締結後に歯舞群島・色丹島を日本へ引き渡すと定めた宣言。現在の日ロ交渉の出発点で、質問当時は安倍政権がこの宣言を基礎に交渉を加速させていた。"}, {"term": "質問主意書", "definition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["プーチン大統領が「北方領土を引き渡せば米軍基地が置かれるのでは」と懸念を示したとの報道を受け、質問者は「日本は安保条約上、米軍の基地設置を拒否できるのか」「総理が『島に基地は置かない』と伝えたという報道は事実か」など4点を質した。", "政府は4問すべてに対し、「ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい」という一文だけで回答を拒否した。", "公開されている条約の一般的な解釈（問一・四)や、米国と協議したことの「有無」（問三)まで交渉を理由に封印されており、答弁書から得られる情報は実質ゼロ。"], "question_overview": "北方領土交渉が停滞し、ロシア側が「返還後の米軍基地設置」への懸念を公言するなか、交渉の最大の争点である安保条約との関係について、①米国が基地設置を求めた場合に日本は拒めるのか（根拠条文つきで）、②安倍総理が「歯舞・色丹に基地は置かない」とロシア側に伝えたとの報道は事実か、③基地設置の可能性を米国と協議したことはあるか（有無）、④「島に基地を置かない」という取り決めは条約上可能か、の4点を質した。", "answer_overview": "答弁書の本文は一文のみ。「一から四までについて お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。」──4問を一括りにし、条約解釈の一般論も、事実の有無も、すべて「交渉への支障」を理由に回答しなかった。", "items": [{"q_id": "一", "question_excerpt": "日米安保条約に基づき、米国が基地の設置を求めて来た時、日本側の都合により設置を拒むことができるのか、関連する協定や覚書等が存在するならば、その条文を示して明らかにしてください。", "question_plain": "米国が「ここに基地を置きたい」と求めてきたとき、日本は断れるのか？根拠となる条文があるなら示してほしい。", "answer_section": "一から四までについて（一括答弁）", "answer_excerpt": "お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。", "answer_plain": "「ロシアとの交渉に差し支えるので答えない」の一文のみ。条文の提示もなし。", "verdict": "refused_with_reason", "verdict_label": "回答拒否（理由明示）", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 5, "commentary": "公開されている条約の一般的な仕組みを問う設問で、進行中の交渉の中身とは切り分けて答えられる性質のもの。日米地位協定第2条は、施設・区域の提供が日米合同委員会を通じた個別の取極（合意）で決まることを定めており、この一般的な枠組み自体は政府がこれまで国会で繰り返し説明してきた内容でもある。それすら「交渉への支障」を理由に拒む必然性は、答弁書のどこにも説明されていない。", "good_point": null}, {"q_id": "二", "question_excerpt": "安倍総理が、歯舞諸島、色丹島に米軍基地を置くことはないと伝えたと報じられている（平成三十年十一月十六日付朝日新聞朝刊等）が、それは事実か。事実だとしたら、島に米軍基地を置かないと現時点で約束出来る根拠を示してください。", "question_plain": "「総理がロシア側に『引き渡し後の島に米軍基地は置かない』と伝えた」という報道は本当か？本当なら、日本側だけでそんな約束ができる根拠は何か？", "answer_section": "一から四までについて（一括答弁）", "answer_excerpt": "お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。", "answer_plain": "報道の事実確認も、根拠の説明もなし。", "verdict": "refused_with_reason", "verdict_label": "回答拒否（理由明示）", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 8, "commentary": "首脳間交渉での発言内容の確認は外交上の機微に当たり、4問の中では拒否の理由がもっとも成立しやすい設問ではある。ただし、報道が事実であれば「米国の意向を確認しないまま対ロ約束をしたのか」という民主的統制の核心に関わる論点であり、確認も否定もしないままでは、国会が交渉方針を検証する手段が事実上なくなる。", "good_point": null}, {"q_id": "三", "question_excerpt": "北方領土の島々に米軍基地を置かないと米国から確約を得ることが、日ロ平和条約交渉を進展させる前提とならざるを得ないと考えるが、北方領土への米軍基地の設置の可能性について、米国と協議を実施したことはあるのか、事実関係の有無を示してください。", "question_plain": "「北方領土に基地を置くかどうか」を米国と協議したことはあるのか。中身ではなく、有無だけでも示してほしい。", "answer_section": "一から四までについて（一括答弁）", "answer_excerpt": "お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。", "answer_plain": "協議の「有無」すら示さなかった。", "verdict": "refused_with_reason", "verdict_label": "回答拒否（理由明示）", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 5, "commentary": "協議の中身ではなく「有無」という最小限の事実だけを問う、拒否されにくいよう意図的に絞り込まれた設問。その最小限すら開示しなかったことで、「交渉への支障」という理由がどの範囲まで及ぶのか（際限があるのか）が答弁からは判別できなくなっている。", "good_point": null}, {"q_id": "四", "question_excerpt": "北方領土の島々に米軍基地を設置しないこととする取り決めを結ぶことは、日米安保条約それに付随する様々な協定上、可能なのか、政府の見解を伺います。", "question_plain": "「この島には基地を置かない」という日米間の取り決めを結ぶことは、いまの条約の仕組み上そもそも可能なのか？", "answer_section": "一から四までについて（一括答弁）", "answer_excerpt": "お尋ねについては、ロシア連邦政府との今後の交渉に支障を来すおそれがあることから、お答えすることは差し控えたい。", "answer_plain": "条約解釈の一般論としても答えなかった。", "verdict": "refused_with_reason", "verdict_label": "回答拒否（理由明示）", "patterns": [{"code": "P2", "label": "差し控え型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 5, "commentary": "問一と同じく、特定の交渉から切り離して答えられる条約解釈の一般論。ここまで一括して一文で処理したことで、答弁書全体の情報量がゼロになり、「答えられない範囲」の説明責任も果たされていない。", "good_point": null}], "overall": {"score": 8, "grade": "E", "grade_scale": "A（誠実に回答）〜E（ほぼ回答拒否）の5段階", "headline": "4問を一文で封印 — 条約解釈の一般論まで「交渉への支障」", "a nition": "国会議員が内閣に文書で行う質問。内閣は閣議決定を経た「答弁書」で回答する義務があり、政府の公式見解が文書で残る。"}], "tldr": ["「答弁拒否の連発」自体をテーマにしたメタ構造の質問主意書。前回の答弁書の拒否文言を一つずつ引用し、「なぜ答える立場にないのか」「なぜ仮定の質問に答えられないのか」「差し控え急増の理由を類型化して示せ」「多用を自粛すべきでは」と迫った。", "政府の回答の核心は「議院において答弁を求められた事項について、合理的な理由がある場合には、答弁を差し控える旨の答弁をすることも許容される」——説明拒否を問われて、拒否が許される場合があるという一般論で応じた。何が『合理的な理由』かは示されていない。", "12の設問の多くが「趣旨不明」の前置きと前回答弁書の参照で処理された一方、首相の国会答弁に「事実と異なるものがあった」ことへの謝罪を答弁書上でも確認しており、記録としての収穫もある。"], "question_overview": "前回国会で提出した質問主意書への答弁書（「お答えする立場にない」「仮定の質問」「一概に困難」等の拒否のオンパレード）を全文引用したうえで、その一つ一つに再質問する「追い質問」型の設計。公文書管理の制度論（保存期間・電子化）から、桜を見る会前夜祭を巡る虚偽答弁への政府の責任、「はい/いいえ」を明示した確認質問、説明拒否急増（桜井准教授の調査で1970年比80倍）の理由の類型化要求、拒否文言の自粛提案まで、計12問を積み上げた。", "answer_overview": "12問を7ブロックに再編。公文書の保存期間は現行法令の枠組み説明（一の1）、全文書の電子的永久保存には「慎重な検討が必要」（一の2）。前夜祭関連は「前首相個人の政治活動であり政府としてお答えする立場にない」を再掲し（二の1・2）、「はい/いいえ」を求めた確認質問には前回答弁書の参照のみ（三）。「責任」の解釈を問うた設問には、首相が本会議で「答弁の中に事実と異なるものがあった」と謝罪した事実に言及（四・五の2）。そして説明拒否の理由の類型化と自粛を求めた核心部分には、「合理的な理由がある場合には、答弁を差し控える旨の答弁をすることも許容される」という一般論を示した（五の1・3・4）。", "items": [{"q_id": "一の1", "question_excerpt": "保存期間をいたずらに短くして満了後直ちに廃棄するという考え方自体を改める必要があると考えるが、如何か。政府の見解を伺いたい。", "question_plain": "公文書改ざん問題を踏まえ、「保存期間を短くしてすぐ廃棄する」という運用の考え方自体を改めるべきではないか？", "answer_section": "一の１について", "answer_excerpt": "お尋ねの「保存期間をいたずらに短くして満了後直ちに廃棄するという考え方」の意味するところが必ずしも明らかではないが、…各行政機関において当該定めに従って適切に行政文書の管理を行っているところである。", "answer_plain": "現行の法令・ガイドラインの枠組みを説明し、「適切に管理している」と回答。「考え方を改めるべきか」という問いには答えていない。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 35, "commentary": "現行制度の説明としては一定の情報があるが、改ざん問題を踏まえて「運用の考え方を見直すか」という規範的な問いには触れず、「適切に行っている」という現状肯定で締めている。問いの前提（問題が起きた）と回答（適切である）の間の緊張が説明されていない。", "good_point": null}, {"q_id": "一の2", "question_excerpt": "全ての行政文書を電子データとして永久保存とするべきと考えるが、如何か。政府の見解を伺いたい。", "question_plain": "行政文書はすべて電子データで永久保存すべきではないか？", "answer_section": "一の２について", "answer_excerpt": "政府においては、行政文書の電子的管理を推進しているところであるが、お尋ねの「全ての行政文書を電子データとして永久保存する」ことについては、行政文書の体系的管理や効率的な行政運営の観点から、慎重な検討が必要である ": "三について", "answer_excerpt": "お尋ねの内容については、前回答弁書六についてでお答えしたとおりである。", "answer_plain": "前回の答弁書（当時の国会答弁の引用）を参照しただけで、「はい/いいえ」には答えなかった。", "verdict": "evaded", "verdict_label": "実質回答なし", "patterns": [{"code": "P4", "label": "過去答弁引用型"}], "responsiveness": 10, "commentary": "「前回の答弁がわかりにくいので、はい/いいえで示してほしい」という明示的な要望に対し、そのわかりにくい前回答弁をもう一度参照するだけの回答。質問の設計意図を正面から無視しており、参照先をたどっても新しい情報はゼロ。", "good_point": null}, {"q_id": "四・五の2", "question_excerpt": "菅義偉政権においては、「責任」という語の解釈が状況によって変わり、国語的に明確な定義をせずに発言されているという理解でよいか。（五の2では、秘書の略式起訴により補塡が裁判所認定の事実となったことを踏まえ、どう責任を取るのかを確認）", "question_plain": "「責任は私にある」と言いながら何の責任も取られていない。政権の言う「責任」とはどういう意味なのか。補塡が事実と確定した今、どう責任を取るのか？", "answer_section": "四及び五の２について", "answer_excerpt": "お尋ねの趣旨が必ずしも明らかではないが、「責任」という語については、前回答弁書七についてでお答えしたとおりである。なお、…菅内閣総理大臣は「先の国会における「桜を見る会」前夜の夕食会に関する私の答弁の中に、事実と異なるものがあったことについて、大変申し訳なく、改めてお詫び申し上げます。」と述べているところである。", "answer_plain": "「責任」の定義論は前回答弁書の参照で済ませた。ただし、首相自身の答弁に「事実と異なるものがあった」ことへの謝罪を答弁書上でも引用・確認した。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P4", "label": "過去答弁引用型"}, {"code": "P5", "label": "まとめ答弁型"}], "responsiveness": 30, "commentary": "「解釈が状況で変わるという理解でよいか」という確認にも、「どう責任を取るのか」という核心にも答えていない。一方で、首相の国会答弁に事実と異なるものがあったことと、それへの謝罪を閣議決定文書で確認した点は、公式記録として残る意味がある。", "good_point": "首相答弁に「事実と異なるものがあった」ことと謝罪を、閣議決定を経た答弁書上で確認した。"}, {"q_id": "五の1・3・4", "question_excerpt": "なぜ仮定の質問に答えられないのか、その具体的かつ論理的な根拠…を伺いたい。（五の3では説明拒否急増の理由の類型化を、五の4では「差し控え」等の多用の自粛を要求）", "question_plain": "「仮定の質問には答えない」のはなぜか。説明拒否が1970年の80倍に増えた理由を類型化して示してほしい。合理的理由のない拒否文言の多用は自粛すべきではないか？", "answer_section": "五の１、３及び４について", "answer_excerpt": "内閣総理大臣その他の国務大臣は国会において誠実に答弁する責任を負っており、…議院において答弁を求められた事項について、合理的な理由がある場合には、答弁を差し控える旨の答弁をすることも許容されるものと考えている。", "answer_plain": "「誠実に答弁する責任はあるが、合理的な理由があれば差し控えも許される」という一般論を提示。急増の理由の類型化にも、自粛の是非にも触れなかった。", "verdict": "partial", "verdict_label": "部分回答", "patterns": [{"code": "P1", "label": "趣旨不明型"}, {"code": "P5", "label": "まとめ答弁型"}, {"code": "P8", "label": "論点スルー型"}], "responsiveness": 40, " <script>
  const CASES = JSON.parse(document.getElementById("data").textContent);
  const esc = s => String(s ?? "").replace(/[&<>"']/g,
    c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const VERDICTS = [
    ["answered", "回答", "var(--good)"],
    ["partial", "部分回答", "var(--warn)"],
    ["evaded", "実質回答なし", "var(--bad)"],
    ["refused_with_reason", "回答拒否（理由明示）", "var(--neutral-pill)"],
  ];
  const VERDICT_COLOR = Object.fromEntries(VERDICTS.map(([k, , c]) => [k, c]));

  const AXES = [
    ["responsiveness", "回答充足度"],
    ["specificity", "具体性"],
    ["evidence", "根拠の提示"],
    ["clarity", "明瞭さ"],
  ];

  const PATTERN_LEGEND = [
    ["P1 趣旨不明型", "「お尋ねの趣旨が明らかではない」として答えない"],
    ["P2 差し控え型", "「お答えを差し控えたい」として答えない"],
    ["P3 作業困難型", "「膨大な作業を要する」等を理由に資料・数値を示さない"],
    ["P4 過去答弁引用型", "過去の答弁の引用のみで、現在の説明・根拠を示さない"],
    ["P5 まとめ答弁型", "複数の設問を一括りにして個別の論点への回答を薄める"],
    ["P6 指標すり替え型", "問われた数値・定義と異なるものに断りなく置き換えて答える"],
    ["P7 仮定不応答型", "「仮定の質問にはお答えできない」として答えない"],
    ["P8 論点スルー型", "質問者の論拠・前提に反論も説明もせず結論だけ述べる"],
    ["P9 一概困難型", "「個別具体の事情により一概にお答えすることは困難」として基準を示さない"],
  ];

  const gradeOf = s => s >= 85 ? "A" : s >= 70 ? "B" : s >= 50 ? "C" : s >= 30 ? "D" : "E";
  const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
  const r1 = x => Math.round(x * 10) / 10;

  const personHref = (role, name) => `#/person/${role}/${encodeURIComponent(name)}`;
  const bySubmitter = name => CASES.filter(c => c.source.submitter === name);
  const byAnswerer = name => CASES.filter(c => c.source.answerer_name === name);

  /* ---------- shared fragments ---------- */

  function axisRow(label, score) {
    return `<div class="axis">
      <span class="name">${esc(label)}</span>
      <span class="bar"><i style="width:${score}%"></i></span>
      <span class="val mono">${r1(score)}</span>
    </div>`;
  }

  function caseCard(c) {
    const s = c.source, o = c.overall;
    return `<a class="case-card" href="#/case/${esc(c.id)}">
      <div class="cc-top">
        <div>
          <p class="cc-eyebrow">${esc(s.house_label)} 第${s.session}回国会 質問第${s.number}号 ・ ${esc(s.answered_on)}答弁</p>
          <p class="cc-title">${esc(s.title)}</p>
        </div>
        <span class="cc-grade" aria-label="総合評価 ${esc(o.grade)}">${esc(o.grade)}</span>
      </div>
      <p class="cc-head">${esc(o.headline)}　<span class="mono">${o.score}/100</span></p>
      <p class="cc-people">提出 <b>${esc(s.submitter)}</b>　／　答弁 <b>${esc(s.answerer_title)} ${esc(s.answerer_name)}</b></p>
    </a>`;
  }

  function distRows(entries, total) {
    return entries.map(([label, count, color]) => `<div class="row">
      <span class="lbl">${esc(label)}</span>
      <span class="bar"><i style="width:${total ? count / total * 100 : 0}%;background:${color}"></i></span>
      <span class="cnt mono">${count}</span>
    </div>`).join("");
  }

  function itemCard(it) {
    const col = VERDICT_COLOR[it.verdict] || "var(--neutral-pill)";

      <div class="item-head">

      </div>
      <div class="item-body">
        <div class="speech">
          <span class="who">質問（${esc(it.q_id)}）</span>
          <blockquote>${esc(it.question_excerpt)}</blockquote>
          <p class="plain"><b class="lead">なにを聞いている？</b>${esc(it.question_plain)}</p>
        </div>
        <div class="speech">
          <span class="who gov">政府答弁（${esc(it.answer_section)}）</span>
          <blockquote>${esc(it.answer_excerpt)}</blockquote>
          <p class="plain"><b class="lead">どう答えた？</b>${esc(it.answer_plain)}</p>
        </div>
        <p class="commentary"><b class="lead">評価</b>${esc(it.commentary)}</p>
        ${it.good_point ? `<p class="goodpoint"><b class="lead">誠実ハイライト</b>${esc(it.good_point)}</p>` : ""}
      </div>
    </article>`;
  }

  function siteFooter(extra) {
    return `${extra ? esc(extra) + "<br>" : ""}
      本サイトの評価はAIによる試作です。公開された質問・答弁の全文のみに基づき、
      特定の政党・議員・政府への支持・不支持を意味しません。
      出典: 参議院・衆議院「質問主意書・答弁書」`;
  }

  /* ---------- views ---------- */

  function renderHome() {
    const scores = CASES.map(c => c.overall.score);
    const nItems = CASES.reduce((n, c) => n + c.items.length, 0);
    document.getElementById("app").innerHTML = `
      <p class="home-intro">国会の質問主意書と政府答弁書をAIが読み、
      「何を聞いたのか」「どう答えたのか」を平易な日本語に翻訳したうえで、
      答弁が質問に実質的に答えているか（誠実度）を設問ごとに評価します。

      <div class="stat-strip">
        <div class="stat"><span class="k">収録した答弁書</span><br><span class="v mono">${CASES.length}<small> 件</small></span></div>
        <div class="stat"><span class="k">逐条評価した設問</span><br><span class="v mono">${nItems}<small> 問</small></span></div>
        <div class="stat"><span class="k">平均誠実度スコア</span><br><span class="v mono">${r1(avg(scores))}<small> /100</small></span></div>
      </div>
      <div class="case-list">
        <h2 class="sec-label" style="margin:24px 0 0">収録答弁</h2>
        ${CASES.map(caseCard).join("")}
      </div>
      <section class="method">
        <h2 class="sec-label" style="margin-top:44px">評価の方法</h2>
        <p>評価対象は「答弁が質問に実質的に答えているか」のみで、政策の当否や政治的立場は評価しません。
        設問ごとに 回答／部分回答／実質回答なし／回答拒否（理由明示）を判定し、
        回避の手法を次の分類でタグ付けします。質問側の質も同じ基準で評価します。</p>
        <div class="legend">
          ${PATTERN_LEGEND.map(([code, txt]) =>
            `<div class="row"><span class="code">${esc(code)}</span><span>${esc(txt)}</span></div>`).join("")}
        </div>
      </section>`;
    document.getElementById("foot").innerHTML = siteFooter("");
  }

  function renderCase(c) {
    const s = c.source, o = c.overall;
    document.getElementById("app").innerHTML = `
      <p class="crumb"><a href="#/">← 一覧へ</a></p>
      <section class="case-head">
        <p class="eyebrow">${esc(s.house_label)} 第${s.session}回国会 質問第${s.number}号</p>
        <h1 class="case-title">${esc(s.title)}</h1>
        <dl class="meta">
          <div><dt>提出者</dt><dd><a href="${personHref("submitter", s.submitter)}">${esc(s.submitter)}</a></dd></div>
          <div><dt>答弁者</dt><dd><a href="${personHref("answerer", s.answerer_name)}">${esc(s.answerer_title)} ${esc(s.answerer_name)}</a></dd></div>
          <div><dt>提出日</dt><dd>${esc(s.submitted_on)}</dd></div>
          <div><dt>答弁書受領日</dt><dd>${esc(s.answered_on)}</dd></div>
          <div><dt>分野</dt><dd>${(c.topic_tags || []).map(esc).join("・")}</dd></div>
        </dl>
        <p class="src-links">原文（${esc(s.house_label)}サイト）:
          <a href="${esc(s.urls.question)}" target="_blank" rel="noopener">質問本文</a>
          <a href="${esc(s.urls.answer)}" target="_blank" rel="noopener">答弁本文</a>
          <a href="${esc(s.urls.meisai)}" target="_blank" rel="noopener">経過情報</a>
        </p>
      </section>

      <section class="tldr">
        <h2 class="sec-label">３行でわかる</h2>

      <section class="overall">
